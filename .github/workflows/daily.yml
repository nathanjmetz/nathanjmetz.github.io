name: Daily update

on:
  schedule:
    - cron: "17 10 * * *"   # news: 6:17 AM Eastern in fall/summer, 5:17 AM in winter
    - cron: "41 * * * *"    # site status only, every hour
  workflow_dispatch:         # "Run workflow" button on GitHub
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # to save each day's data back to the repo
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Pull fresh news and schedules
        if: github.event_name != 'pull_request' && github.event.schedule != '41 * * * *'
        run: python -m sitegen.fetch

      # Saving data keeps yesterday's stories if a source is down, and keeps
      # the repo active so GitHub never pauses the daily schedule.
      - name: Save today's data
        if: github.event_name != 'pull_request' && github.event.schedule != '41 * * * *'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Daily data $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Check that Nathan's sites are up
        if: github.event_name != 'pull_request'
        run: python -m sitegen.health

      - name: Build site
        run: python -m sitegen.build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
