// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const byId = Object.fromEntries(E.map((e) => [e.id, e]));
const catById = Object.fromEntries(CATS.map((c) => [c.id, c]));
const inCat = (id) => E.filter((e) => e.cat === id);
const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function href(id) {
  if (id === "t-timeline") return "#timeline";
  return "#e-" + id;
}

function rich(text) {
  return esc(text)
    .replace(/\{\{([a-z0-9-]+)\|([^}]+)\}\}/g, (_, id, words) => `<a class="wl" href="${href(id)}">${words}</a>`)
    .replace(/\[(\d+)\]/g, (_, n) => `<button type="button" class="cite" data-n="${n}" aria-label="Source ${n}">${n}</button>`);
}

function sourceItem(key, n) {
  const s = S[key];
  return `<li id="src-${n}"><a href="${s.url}" target="_blank" rel="noopener">${esc(s.t)}</a><span>${esc(s.pub)} · ${s.type}</span></li>`;
}

// ---------- views ----------
function navHTML(current) {
  const groups = [...new Set(CATS.map((c) => c.group))];
  return `<h2>Site</h2><ul><li><a href="/"><span>Nathan's Daily front page</span><span class="n"></span></a></li></ul>` + groups.map((g) => `
    <h2>${g}</h2>
    <ul>${CATS.filter((c) => c.group === g).map((c) => {
      const n = c.page ? (c.id === "glossary" ? GLOSSARY.length : c.id === "timeline" ? TIMELINE.length : c.id === "active" ? ACTIVE.length : "") : inCat(c.id).length;
      const to = c.page ? "#" + c.id : "#c-" + c.id;
      return `<li><a href="${to}"${current === c.id ? ' aria-current="page"' : ""}><span>${c.name}</span><span class="n">${n}</span></a></li>`;
    }).join("")}</ul>`).join("");
}

function railFacts(rows) {
  return `<section><h2>About this page</h2><dl class="facts">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl></section>`;
}

function todayExamples() {
  const ex = [
    ["A new model release", "What it is, what it's better at, and what it costs, with the company's announcement and an independent write-up as sources."],
    ["A court ruling or new law", "What changed and who it affects, linked to the ruling or the law itself."],
  ];
  return ex.map(([h, p]) => `<div class="today-item"><span class="ex">EXAMPLE · NOT REAL NEWS</span><h3>${h}</h3><p>${p}</p></div>`).join("");
}

function entryList(list) {
  return `<ul class="entry-list">${list.map((e) => `
    <li><a href="${href(e.id)}">
      <strong>${esc(e.title)}</strong><p>${esc(e.one)}</p>
      <span class="foot"><span>${catById[e.cat].name}</span><span>·</span><span>${e.src.length} source${e.src.length === 1 ? "" : "s"}</span>${e.stub ? '<span class="pill stub">Starter</span>' : ""}</span>
    </a></li>`).join("")}</ul>`;
}

function viewCat(id) {
  const c = catById[id];
  if (!c || c.page) return null;
  const list = inCat(id);
  const srcs = new Set(list.flatMap((e) => e.src));
  return {
    nav: id, title: c.name,
    main: `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span>/</span><span>${c.group}</span></nav>
      <p class="kicker">${c.group}</p>
      <h1 class="title">${c.name}</h1>
      <p class="lede">${c.blurb}</p>
      ${entryList(list)}`,
    rail: railFacts([["Entries", list.length], ["Sources", srcs.size], ["Starter entries", list.filter((e) => e.stub).length], ["Updated", fmtDate(UPDATED)]]),
  };
}

function tag(src) { return `<span class="src-tag" data-src="${src}">${src}</span>`; }

function waysHTML(topic) {
  const cards = CHOICES.filter((c) => c.topic === topic);
  if (!cards.length) return "";
  return `<h2 class="ways-title" id="s-nathans-way">Nathan's way</h2>
    <p class="ways-note">From the shared rulebook both Macs work from. Each box says whether it's Brawn, Personal or TLC.</p>
    ${cards.map((c) => `<div class="way" data-src="${c.source}">
      <div class="way-head">${tag(c.source)}${c.status === "draft" ? '<span class="pill stub">Draft: waiting on your OK</span>' : ""}<span class="pill">Since ${fmtDate(c.since)}</span></div>
      <p><b>Nathan's way:</b> ${esc(c.way)}</p><p><b>Why:</b> ${esc(c.why)}</p><p><b>Not chosen:</b> ${esc(c.not)}</p></div>`).join("")}`;
}

function compareHTML(key) {
  const o = OPTIONS[key];
  if (!o) return "";
  return `<h2 id="s-the-options">The options</h2>
    <div class="compare-wrap" tabindex="0" role="region" aria-label="Options compared"><table class="compare"><thead><tr><th scope="col">Option</th>${o.cols.map((c) => `<th scope="col">${c}</th>`).join("")}</tr></thead>
    <tbody>${o.rows.map(([name, a, b, c, used]) => `<tr><th scope="row">${esc(name)}${used.length ? `<div class="used">${used.map(tag).join("")}</div>` : ""}</th><td>${esc(a)}</td><td>${esc(b)}</td><td>${esc(c)}</td></tr>`).join("")}</tbody></table></div>`;
}

function viewEntry(id) {
  const e = byId[id];
  if (!e) return null;
  const c = catById[e.cat];
  const sibs = inCat(e.cat), i = sibs.indexOf(e);
  const prev = sibs[i - 1], next = sibs[i + 1];
  const sections = e.body.map(([h, p]) => `<h2 id="s-${slug(h)}">${esc(h)}</h2><p>${rich(p)}</p>`).join("");
  const path = e.path ? `<ol>${e.path.map((pid) => `<li><a class="wl" href="${href(pid)}">${esc(byId[pid].title)}</a>: ${esc(byId[pid].one)}</li>`).join("")}</ol>` : "";
  return {
    nav: e.cat, title: e.title, reading: true,
    main: `
      <article class="article">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span>/</span><a href="#c-${c.id}">${c.name}</a></nav>
        <h1 class="title">${esc(e.title)}</h1>
        <div class="meta"><span>Updated <b>${fmtDate(UPDATED)}</b></span><span><b>${e.src.length}</b> source${e.src.length === 1 ? "" : "s"}</span>${e.stub ? '<span class="pill stub">Starter entry</span>' : ""}</div>
        <div class="oneline"><strong>In one line</strong>${esc(e.one)}</div>
        <div class="prose">${sections}${path}${e.compare ? compareHTML(e.compare) : ""}</div>
        ${waysHTML(e.id)}
        ${e.stub ? `<p class="stub-note">This is a starter entry. It will grow with new sources at the next refresh.</p>` : ""}
      </article>
      ${e.src.length ? `<section class="sources" aria-labelledby="h-src"><h2 id="h-src">Sources</h2><p>Numbers in the text match this list. Each link opens the original in a new tab.</p><ol>${e.src.map((k, n) => sourceItem(k, n + 1)).join("")}</ol></section>` : ""}
      ${e.related.length ? `<section class="related"><h2>Related</h2><div class="chips">${e.related.map((r) => `<a href="${href(r)}">${esc(byId[r].title)}</a>`).join("")}</div></section>` : ""}
      <nav class="pager" aria-label="More in ${c.name}">
        ${prev ? `<a href="${href(prev.id)}"><small>Previous in ${c.name}</small><strong>${esc(prev.title)}</strong></a>` : ""}
        ${next ? `<a class="next" href="${href(next.id)}"><small>Next in ${c.name}</small><strong>${esc(next.title)}</strong></a>` : ""}
      </nav>`,
    rail: `<section class="toc"><h2>On this page</h2><ol>${e.body.map(([h]) => `<li><a href="#e-${e.id}" data-jump="s-${slug(h)}">${esc(h)}</a></li>`).join("")}${e.compare ? `<li><a href="#e-${e.id}" data-jump="s-the-options">The options</a></li>` : ""}${CHOICES.some((c) => c.topic === e.id) ? `<li><a href="#e-${e.id}" data-jump="s-nathans-way">Nathan's way</a></li>` : ""}${e.src.length ? `<li><a href="#e-${e.id}" data-jump="h-src">Sources</a></li>` : ""}</ol></section>` +
      railFacts([["Topic", c.name], ["Sources", e.src.length], ["Updated", fmtDate(UPDATED)]]),
  };
}

function viewGlossary() {
  const letters = [...new Set(GLOSSARY.map(([t]) => t[0].toUpperCase()))];
  return {
    nav: "glossary", title: "Glossary",
    main: `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span>/</span><span>Basics</span></nav>
      <h1 class="title">Glossary</h1>
      <p class="lede">${GLOSSARY.length} terms in plain words. Each one links to the entry that explains it.</p>
      <div class="letters" role="group" aria-label="Jump to letter">${letters.map((l) => `<button type="button" data-letter="${l}">${l}</button>`).join("")}</div>
      <dl class="gloss">${GLOSSARY.map(([t, d, id]) => `<div id="g-${slug(t)}" data-l="${t[0].toUpperCase()}"><dt>${esc(t)}</dt><dd>${esc(d)} <a href="${href(id)}">Read more</a></dd></div>`).join("")}</dl>`,
    rail: railFacts([["Terms", GLOSSARY.length], ["Updated", fmtDate(UPDATED)]]),
  };
}

function viewTimeline() {
  return {
    nav: "timeline", title: "Timeline",
    main: `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span>/</span><span>Latest</span></nav>
      <h1 class="title">Timeline</h1>
      <p class="lede">The moments that shaped AI, each with its source. Each refresh adds new moments.</p>
      <ol class="timeline">${TIMELINE.map(([y, h, p, s, e]) => `
        <li><span class="yr">${y}</span><h2>${e ? `<a class="wl" href="${href(e)}" style="color:inherit">${esc(h)}</a>` : esc(h)}</h2><p>${esc(p)}</p>
        <p class="src">Source: <a href="${S[s].url}" target="_blank" rel="noopener">${esc(S[s].t)}</a></p></li>`).join("")}</ol>`,
    rail: railFacts([["Moments", TIMELINE.length], ["From", TIMELINE[0][0]], ["To", TIMELINE[TIMELINE.length - 1][0]]]),
  };
}

function viewActive() {
  const srcs = ["Brawn", "Personal", "TLC"];
  const cell = (v) => v ? esc(v) : "";
  const learnList = (list) => `<ol>${list.map(([name, id, who, why]) => `<li><strong>${id ? `<a class="wl" href="${href(id)}">${esc(name)}</a>` : esc(name)}</strong><div class="tags">${who.map(tag).join("")}</div><p>${esc(why)}${id ? "" : " Article coming."}</p></li>`).join("")}</ol>`;
  return {
    nav: "active", title: "Where I'm active",
    main: `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span>/</span><span>My building</span></nav>
      <p class="kicker">My building</p>
      <h1 class="title">Where I'm active</h1>
      <p class="lede">What each side of my work uses today, side by side, and where knowing the options would help most.</p>
      <div class="active-wrap" tabindex="0" role="region" aria-label="Tools in use by Brawn, Personal and TLC"><table class="active"><thead><tr><th scope="col">Area</th>${srcs.map((x) => `<th scope="col">${tag(x)}</th>`).join("")}</tr></thead>
      <tbody>${ACTIVE.map(([area, id, by]) => `<tr><th scope="row">${id ? `<a href="${href(id)}">${esc(area)}</a>` : esc(area)}</th>${srcs.map((x) => by[x] ? `<td>${cell(by[x])}</td>` : `<td class="none">Not used</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="learn">
        <section class="panel"><h2>Should know</h2><p>You use it or will choose soon, and it's hard to switch or touches money, sign-in or people's data.</p>${learnList(LEARN.should)}</section>
        <section class="panel"><h2>Could know</h2><p>Close to what you do and would open options, but nothing depends on it yet.</p>${learnList(LEARN.could)}</section>
      </div>
      <p class="stub-note">Built from both Macs' project folders on Oct 24, 2026, tool names only. The "should" and "could" rule is a first draft for you to change.</p>`,
    rail: railFacts([["Areas", ACTIVE.length], ["Should know", LEARN.should.length], ["Could know", LEARN.could.length], ["Updated", fmtDate(UPDATED)]]),
  };
}

function viewToday() {
  return {
    nav: "today", title: "What's new",
    main: `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span>/</span><span>Latest</span></nav>
      <h1 class="title">What's new</h1>
      <p class="lede">Each time the wiki is refreshed, the few things that mattered since the last refresh land here, each in two or three sentences, each with at least two sources. Entries they affect get updated too.</p>
      <div class="panel" style="margin-top:28px;max-width:44rem">${todayExamples()}</div>
      <p class="stub-note">These are examples of the format, not real news. Real items arrive with the first refresh.</p>`,
    rail: railFacts([["Updates", "By hand"], ["Last refresh", fmtDate(UPDATED)]]),
  };
}

function route() {
  const h = (location.hash || "#home").slice(1);
  let v = null;
  if (h === "home" || h === "") v = viewHome();
  else if (h.startsWith("c-")) v = viewCat(h.slice(2));
  else if (h.startsWith("e-")) v = viewEntry(h.slice(2));
  else if (h === "glossary") v = viewGlossary();
  else if (h === "timeline") v = viewTimeline();
  else if (h === "today") v = viewToday();
  else if (h === "active") v = viewActive();
  if (!v) v = { nav: "", title: "Not found", main: `<h1 class="title">That page isn't here</h1><p class="lede">It may have moved. <a href="#home">Go to the front page</a> or press <kbd>/</kbd> to search.</p>`, rail: "" };
  return v;
}

function render() {
  const v = route();
  const apply = () => {
    $("#nav").innerHTML = navHTML(v.nav);
    $("#main").innerHTML = v.main;
    $("#rail").innerHTML = v.rail;
    $("#shell").classList.toggle("reading", !!v.reading);
    document.title = v.title === "Nathan's AI Wiki" ? v.title : v.title + " · Nathan's AI Wiki";
    window.scrollTo(0, 0);
    closeNav();
  };
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (document.startViewTransition && !calm && render.ran) document.startViewTransition(apply);
  else apply();
  render.ran = true;
}

// ---------- interactions ----------
document.addEventListener("click", (ev) => {
  const cite = ev.target.closest(".cite");
  if (cite) {
    const li = document.getElementById("src-" + cite.dataset.n);
    if (li) {
      li.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
      li.classList.add("flash");
      setTimeout(() => li.classList.remove("flash"), 900);
      li.querySelector("a").focus({ preventScroll: true });
    }
    return;
  }
  const jump = ev.target.closest("[data-jump]");
  if (jump) {
    ev.preventDefault();
    document.getElementById(jump.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const letter = ev.target.closest("[data-letter]");
  if (letter) {
    document.querySelector(`.gloss [data-l="${letter.dataset.letter}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

// mobile drawer
const menuBtn = $("#menu-btn"), scrim = $("#scrim");
function closeNav() { document.body.classList.remove("nav-open"); menuBtn.setAttribute("aria-expanded", "false"); scrim.hidden = true; }
menuBtn.addEventListener("click", () => {
  const open = !document.body.classList.contains("nav-open");
  document.body.classList.toggle("nav-open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  scrim.hidden = !open;
});
scrim.addEventListener("click", closeNav);

// search
const INDEX = [
  ...E.map((e) => ({ title: e.title, sub: catById[e.cat].name + " · " + e.one, hay: [e.title, e.one, catById[e.cat].name, ...e.body.flat()].join(" ").toLowerCase(), to: href(e.id) })),
  ...CATS.map((c) => ({ title: c.name, sub: "Topic · " + c.blurb, hay: (c.name + " " + c.blurb).toLowerCase(), to: c.page ? "#" + c.id : "#c-" + c.id })),
  ...GLOSSARY.map(([t, d]) => ({ title: t, sub: "Glossary · " + d, hay: (t + " " + d).toLowerCase(), to: "#glossary" })),
  ...ACTIVE.map(([area, id, by]) => ({ title: area, sub: "Where I'm active · " + Object.entries(by).filter(([, v]) => v).map(([k, v]) => k + ": " + v).join(" · "), hay: (area + " " + Object.values(by).join(" ")).toLowerCase(), to: "#active" })),
  ...TIMELINE.map(([y, h, p, , e]) => ({ title: `${y}: ${h}`, sub: "Timeline · " + p, hay: (y + " " + h + " " + p).toLowerCase(), to: "#timeline" })),
];
const pal = $("#palette"), q = $("#q"), results = $("#results");
let hits = [], sel = 0, lastFocus = null;

function search(text) {
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return INDEX.filter((x) => x.to.startsWith("#e-")).slice(0, 8);
  return INDEX
    .map((x) => {
      if (!words.every((w) => x.hay.includes(w))) return null;
      const t = x.title.toLowerCase();
      const score = words.reduce((s, w) => s + (t.startsWith(w) ? 6 : t.includes(w) ? 3 : 1), 0);
      return { ...x, score };
    })
    .filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 12);
}
function markUp(s, words) {
  let out = esc(s);
  words.forEach((w) => { if (w.length > 1) out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
  return out;
}
function drawResults() {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  hits = search(q.value);
  sel = Math.min(sel, Math.max(hits.length - 1, 0));
  results.innerHTML = hits.length
    ? hits.map((h, i) => `<li role="option" id="r-${i}" aria-selected="${i === sel}"><a href="${h.to}" tabindex="-1"><span>${markUp(h.title, words)}</span><small>${markUp(h.sub.length > 110 ? h.sub.slice(0, 110) + "…" : h.sub, words)}</small></a></li>`).join("")
    : `<li class="none">Nothing matches "${esc(q.value)}". Try fewer words, or browse the topics.</li>`;
  q.setAttribute("aria-activedescendant", hits.length ? "r-" + sel : "");
}
function openSearch() {
  lastFocus = document.activeElement;
  pal.hidden = false; q.value = ""; sel = 0; drawResults(); q.focus();
}
function closeSearch() { pal.hidden = true; lastFocus?.focus?.(); }
$("#search-btn").addEventListener("click", openSearch);
q.addEventListener("input", () => { sel = 0; drawResults(); });
q.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown") { ev.preventDefault(); sel = Math.min(sel + 1, hits.length - 1); drawResults(); document.getElementById("r-" + sel)?.scrollIntoView({ block: "nearest" }); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); sel = Math.max(sel - 1, 0); drawResults(); document.getElementById("r-" + sel)?.scrollIntoView({ block: "nearest" }); }
  else if (ev.key === "Enter" && hits[sel]) { ev.preventDefault(); pal.hidden = true; location.hash = hits[sel].to; }
  else if (ev.key === "Escape") closeSearch();
});
results.addEventListener("click", (ev) => { if (ev.target.closest("a")) pal.hidden = true; });
pal.addEventListener("click", (ev) => { if (ev.target === pal) closeSearch(); });
document.addEventListener("keydown", (ev) => {
  const typing = /input|textarea/i.test(document.activeElement?.tagName || "");
  if (!pal.hidden) { if (ev.key === "Escape") closeSearch(); return; }
  if ((ev.key === "/" && !typing) || ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k")) { ev.preventDefault(); openSearch(); }
  if (ev.key === "Escape") closeNav();
});

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
