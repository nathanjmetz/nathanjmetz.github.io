<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nathan's AI Wiki</title>
<meta name="description" content="AI explained plainly, every claim sourced, plus what Brawn, Personal and TLC use.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a reference-library shell. Category shelf on the left, the article in a
   reading column, sources and page outline on the right. Collapses to one column. */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --ink: #16201d;
  --ink-2: #4b5a55;
  --ink-3: #5a6863;
  --rule: #d9e0dd;
  --accent: #0d6b5a;
  --accent-soft: #e1efea;
  --mark: #fff1b8;
  --focus: #1c5fd6;
  --brawn: #b4470f;
  --tlc: #1f56c4;
  --personal: #7a6400;

  --read: "Literata", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --s-1: clamp(.78rem, .76rem + .1vw, .84rem);
  --s0: clamp(.92rem, .9rem + .12vw, 1rem);
  --s1: clamp(1.05rem, 1rem + .25vw, 1.2rem);
  --s2: clamp(1.3rem, 1.15rem + .6vw, 1.65rem);
  --s3: clamp(1.8rem, 1.45rem + 1.5vw, 2.8rem);
  --radius: 8px;
  --bar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #161e1c; --ink: #e5ece9; --ink-2: #a9b7b2; --ink-3: #8d9b96;
    --rule: #2a3532; --accent: #5cc8b0; --accent-soft: #19302b; --mark: #4a4114; --focus: #7ea7ff; --brawn: #f08a4b; --tlc: #7ea7ff; --personal: #d9bf4a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #161e1c; --ink: #e5ece9; --ink-2: #a9b7b2; --ink-3: #8d9b96;
  --rule: #2a3532; --accent: #5cc8b0; --accent-soft: #19302b; --mark: #4a4114; --focus: #7ea7ff; --brawn: #f08a4b; --tlc: #7ea7ff; --personal: #d9bf4a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 var(--s0)/1.55 var(--ui); }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8;
  background: var(--surface); border-bottom: 1px solid var(--rule);
}
.bar-in {
  height: var(--bar); display: flex; align-items: center; gap: 12px;
  max-width: 1680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font: 700 var(--s1)/1 var(--read); color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand span { color: var(--accent); }
.search-btn {
  margin-left: auto; display: flex; align-items: center; gap: 10px;
  min-width: 0; width: min(28rem, 100%); height: 40px; padding: 0 12px;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--bg);
  color: var(--ink-3); cursor: text; text-align: left;
  transition: border-color .15s ease-out;
}
.search-btn:hover { border-color: var(--ink-3); }
.search-btn .label { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
kbd { font: 500 .72rem/1 var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 3px 5px; color: var(--ink-3); background: var(--surface); }
.home-link { margin-left: auto; color: var(--ink-2); font-size: var(--s-1); font-weight: 500; text-decoration: none; white-space: nowrap; }
.home-link:hover { color: var(--accent); text-decoration: underline; }
.home-link + .search-btn { margin-left: 0; }
.menu-btn { display: none; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-weight: 500; }

.sample {
  background: var(--accent-soft); color: var(--ink);
  font-size: var(--s-1);
}
.sample p { margin: 0; max-width: 1680px; margin-inline: auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- shell ---------- */
.shell {
  max-width: 1680px; margin: 0 auto;
  display: grid; grid-template-columns: 16.5rem minmax(0, 1fr) 15.5rem; gap: clamp(20px, 2.5vw, 48px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
.nav {
  position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); align-self: start;
  max-height: calc(100vh - var(--bar) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding: 20px 4px 24px 0; scrollbar-width: thin;
}
.nav h2 { font: 600 .72rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 18px 10px 8px; }
.nav h2:first-child { margin-top: 0; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.nav a {
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
  padding: 7px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: var(--s-1); font-weight: 500;
  transition: background-color .15s ease-out, color .15s ease-out;
}
.nav a:hover { background: var(--surface); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.nav a .n { font: 400 .72rem/1 var(--mono); color: var(--ink-3); }

main { min-width: 0; padding-top: 28px; }
/* Article pages: keep the side panel next to the reading column on wide screens. */
.shell.reading { grid-template-columns: 16.5rem minmax(0, 46rem) 15.5rem; justify-content: center; }
.rail {
  position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); align-self: start;
  max-height: calc(100vh - var(--bar) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding: 28px 0 24px; font-size: var(--s-1); scrollbar-width: thin;
}
.rail h2 { font: 600 .72rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.rail section + section { margin-top: 28px; }
.rail ol, .rail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rail a { color: var(--ink-2); text-decoration: none; }
.rail a:hover { color: var(--accent); text-decoration: underline; }
.rail .facts div { display: flex; justify-content: space-between; gap: 8px; padding-block: 6px; border-bottom: 1px solid var(--rule); }
.rail .facts dt { color: var(--ink-3); }
.rail .facts dd { margin: 0; font-family: var(--mono); font-size: .78rem; text-align: right; }

/* ---------- shared bits ---------- */
.crumbs { font-size: var(--s-1); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.crumbs a { color: var(--ink-3); }
.kicker { font: 600 .74rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
h1.title { font: 700 var(--s3)/1.08 var(--read); letter-spacing: -.015em; margin: 0; max-width: 22ch; }
.lede { font: 400 var(--s1)/1.5 var(--read); color: var(--ink-2); margin: 14px 0 0; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; font-size: var(--s-1); color: var(--ink-3); }
.meta b { font-weight: 500; color: var(--ink-2); }
.pill { font: 500 .72rem/1 var(--mono); padding: 4px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--ink-2); }
.pill.stub { background: var(--mark); color: var(--ink); }

/* ---------- article ---------- */
.article { max-width: 44rem; }
.oneline {
  margin: 26px 0 0; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--surface);
  border-radius: 0 var(--radius) var(--radius) 0; font-size: var(--s0);
}
.oneline strong { display: block; font: 600 .72rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.prose { font: 400 var(--s1)/1.7 var(--read); }
.prose h2 { font: 700 var(--s2)/1.2 var(--read); margin: 38px 0 10px; scroll-margin-top: calc(var(--bar) + 20px); }
.prose p { margin: 0 0 14px; max-width: 66ch; }
.prose ol { padding-left: 1.4em; margin: 0 0 14px; }
.prose li { margin-bottom: 8px; }
.prose a.wl { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
.prose a.wl:hover { color: var(--accent); }
.cite {
  font: 500 .66em/1 var(--mono); vertical-align: super; margin-left: 1px;
  border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 2px 4px; cursor: pointer;
}
.cite:hover { background: var(--accent); color: var(--surface); }
.stub-note { margin-top: 24px; padding: 14px 16px; border: 1px dashed var(--rule); border-radius: var(--radius); color: var(--ink-2); font-size: var(--s0); max-width: 66ch; }

.sources { margin-top: 44px; max-width: 44rem; }
.sources h2 { font: 700 var(--s2)/1.2 var(--read); margin: 0 0 6px; }
.sources > p { margin: 0 0 14px; color: var(--ink-3); font-size: var(--s-1); }
.sources ol { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.sources li {
  counter-increment: s; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 2px 8px;
  padding: 12px 10px; border-top: 1px solid var(--rule); border-radius: 6px; transition: background-color .6s ease-out;
}
.sources li::before { content: counter(s); font: 500 .8rem/1.6 var(--mono); color: var(--accent); grid-row: span 2; }
.sources li a { font-weight: 500; overflow-wrap: anywhere; }
.sources li span { grid-column: 2; font-size: var(--s-1); color: var(--ink-3); }
.sources li.flash { background: var(--mark); transition: none; }

.related { margin-top: 36px; max-width: 44rem; }
.related h2 { font: 600 .74rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips a { padding: 8px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); text-decoration: none; font-size: var(--s-1); transition: border-color .15s ease-out; }
.chips a:hover { border-color: var(--accent); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; max-width: 44rem; }
.pager a { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager a.next { text-align: right; grid-column: 2; }
.pager small { color: var(--ink-3); font-size: var(--s-1); }
.pager strong { font: 600 var(--s0)/1.3 var(--read); }

/* ---------- Nathan's way boxes ---------- */
.way { margin: 18px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--src); border-radius: 0 var(--radius) var(--radius) 0; max-width: 66ch; font-size: var(--s0); }
.way[data-src="Brawn"] { --src: var(--brawn); }
.way[data-src="TLC"] { --src: var(--tlc); }
.way[data-src="Personal"] { --src: var(--personal); }
.way-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.src-tag { font: 600 .7rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--src); border: 1.5px solid var(--src); border-radius: 4px; padding: 4px 6px; }
.src-tag[data-src="Brawn"] { --src: var(--brawn); }
.src-tag[data-src="TLC"] { --src: var(--tlc); }
.src-tag[data-src="Personal"] { --src: var(--personal); }
.way p { margin: 4px 0 0; }
.way b { font-weight: 600; }
.ways-title { font: 700 var(--s2)/1.2 var(--read); margin: 38px 0 4px; }
.ways-note { margin: 0; color: var(--ink-3); font-size: var(--s-1); max-width: 66ch; }

/* ---------- comparison table ---------- */
.compare-wrap { overflow-x: auto; margin: 18px 0 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.compare { border-collapse: collapse; width: 100%; min-width: 36rem; font-size: var(--s-1); }
.compare th, .compare td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.compare thead th { font: 600 .72rem/1.2 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--bg); }
.compare tbody th { font: 600 var(--s0)/1.3 var(--read); white-space: nowrap; }
.compare tr:last-child > * { border-bottom: 0; }
.compare .used { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

/* ---------- where I'm active ---------- */
.active-wrap { overflow-x: auto; margin-top: 26px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.active { border-collapse: collapse; width: 100%; min-width: 34rem; font-size: var(--s-1); }
.active th, .active td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.active thead th { background: var(--bg); }
.active tbody th { font: 600 var(--s0)/1.3 var(--read); }
.active tbody th a { color: var(--ink); }
.active td.none { color: var(--ink-3); }
.active tr:last-child > * { border-bottom: 0; }
.learn { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 16px; margin-top: 28px; }
.learn ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 12px; }
.learn li strong { font: 600 var(--s0)/1.3 var(--read); }
.learn li p { margin: 2px 0 0; color: var(--ink-2); font-size: var(--s-1); }
.learn .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

/* ---------- lists of entries ---------- */
.entry-list { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 12px; }
.entry-list a {
  display: flex; flex-direction: column; gap: 6px; height: 100%;
  padding: 16px 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
  text-decoration: none; color: var(--ink); transition: border-color .15s ease-out;
}
.entry-list a:hover { border-color: var(--accent); }
.entry-list strong { font: 600 var(--s1)/1.3 var(--read); }
.entry-list p { margin: 0; color: var(--ink-2); font-size: var(--s-1); }
.entry-list .foot { margin-top: auto; padding-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .74rem; color: var(--ink-3); }

/* ---------- home ---------- */
.home-head { padding-bottom: 8px; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 16px; margin-top: 28px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.panel h2 { font: 700 var(--s1)/1.2 var(--read); margin: 0 0 4px; }
.panel > p { margin: 0 0 12px; color: var(--ink-3); font-size: var(--s-1); }
.path { list-style: none; margin: 0; padding: 0; counter-reset: p; display: flex; flex-direction: column; }
.path li { counter-increment: p; border-top: 1px solid var(--rule); }
.path a { display: grid; grid-template-columns: 2rem 1fr; padding: 10px 0; color: var(--ink); text-decoration: none; }
.path a::before { content: counter(p); font: 500 .85rem/1.5 var(--mono); color: var(--accent); }
.path a:hover span { text-decoration: underline; }
.today-item { border-top: 1px solid var(--rule); padding: 12px 0; }
.today-item h3 { font: 600 var(--s0)/1.35 var(--read); margin: 4px 0; }
.today-item p { margin: 0; font-size: var(--s-1); color: var(--ink-2); }
.today-item .ex { font: 500 .7rem/1 var(--mono); color: var(--ink-3); }

.shelf-title { font: 700 var(--s2)/1.2 var(--read); margin: 44px 0 0; }
.shelf { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: 10px; }
.shelf a {
  display: flex; flex-direction: column; gap: 4px; height: 100%;
  padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface);
  text-decoration: none; color: var(--ink); transition: border-color .15s ease-out;
}
.shelf a:hover { border-color: var(--accent); }
.shelf strong { font: 600 var(--s0)/1.3 var(--read); }
.shelf span { font-size: var(--s-1); color: var(--ink-3); }
.shelf .n { font-family: var(--mono); font-size: .72rem; }

/* ---------- glossary + timeline ---------- */
.letters { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 22px; }
.letters button { min-width: 34px; height: 34px; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; cursor: pointer; font: 500 .8rem/1 var(--mono); }
.letters button:hover { border-color: var(--accent); }
.gloss { margin: 24px 0 0; max-width: 52rem; }
.gloss div { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr); gap: 4px 20px; padding: 12px 0; border-top: 1px solid var(--rule); scroll-margin-top: calc(var(--bar) + 16px); }
.gloss dt { font: 600 var(--s0)/1.4 var(--read); }
.gloss dd { margin: 0; color: var(--ink-2); }
.gloss dd a { white-space: nowrap; }

.timeline { list-style: none; margin: 28px 0 0; padding: 0; max-width: 50rem; border-left: 2px solid var(--rule); }
.timeline li { position: relative; padding: 0 0 22px 22px; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.timeline .yr { font: 500 .85rem/1.4 var(--mono); color: var(--accent); }
.timeline h2 { font: 600 var(--s1)/1.3 var(--read); margin: 2px 0 4px; }
.timeline p { margin: 0; color: var(--ink-2); }
.timeline .src { font-size: var(--s-1); margin-top: 4px; }

/* ---------- search dialog ---------- */
.palette[hidden] { display: none; }
.palette { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 35%, transparent); display: flex; justify-content: center; align-items: flex-start; padding: calc(8vh + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.palette-box { width: min(40rem, 100%); background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden; display: flex; flex-direction: column; max-height: 76vh; animation: pop .16s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.99); } }
.palette input { border: 0; border-bottom: 1px solid var(--rule); padding: 16px 18px; font: 400 var(--s1)/1.3 var(--ui); background: transparent; color: var(--ink); outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.palette li a { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.palette li a small { color: var(--ink-3); font-size: var(--s-1); }
.palette li a mark { background: var(--mark); color: inherit; border-radius: 2px; }
.palette li[aria-selected="true"] a { background: var(--accent-soft); }
.palette .hint { padding: 10px 16px; border-top: 1px solid var(--rule); font-size: .74rem; color: var(--ink-3); display: flex; gap: 14px; flex-wrap: wrap; }
.palette .none { padding: 18px; color: var(--ink-3); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .shell, .shell.reading { grid-template-columns: 15rem minmax(0, 1fr); }
  .rail { position: static; max-height: none; grid-column: 2; padding-top: 0; }
  .rail .toc { display: none; }
}
@media (max-width: 860px) {
  .shell, .shell.reading { grid-template-columns: minmax(0, 1fr); }
  .rail { grid-column: 1; }
  .menu-btn { display: inline-flex; align-items: center; }
  .search-btn kbd { display: none; }
  .nav {
    position: fixed; z-index: 15; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0;
    align-self: stretch; max-height: calc(100dvh - var(--bar) - env(safe-area-inset-top, 0px)); overscroll-behavior: contain;
    width: min(20rem, 86vw); background: var(--surface); border-right: 1px solid var(--rule);

  "body": [
   [
    "What it is",
    "Once row-level security (RLS) is turned on for a table, every normal access must be allowed by a rule called a policy. If no policy exists, no rows are visible and none can be changed [1]. Superusers and roles with the BYPASSRLS setting skip RLS, and so do table owners unless the table is set to force it [1]. A policy has two parts. USING says which existing rows a command may see or target, and WITH CHECK says which new or changed rows are allowed [1]. A simple example lets managers see only the rows where the manager column matches their own username [1]."
   ],
   [
    "Why every Supabase table needs it",
    "Supabase tells you to enable RLS on every table in an exposed schema, because a table without it can be read and written by any role that has been given access [2]. Supabase's publishable key is meant to be put in public code, and what it can reach is limited by RLS [3]. A request with no signed-in user runs as the anon role [3]. So the browser can talk straight to the database, and RLS is the lock that stands between a visitor and your data. This is why it appears in {{backend-database|Backends and databases}}."
   ],
   [
    "Writing a policy",
    "Two checks run in order. Grants decide whether a role can run an operation at all, and policies then filter which rows it affects [2]. In a policy, auth.uid() returns the ID of the signed-in user, or null when nobody is signed in [2]. The to clause limits a policy to one role, such as anon or authenticated [2]. A typical rule says a row can be read when its user_id column equals auth.uid(). {{sign-in-auth|Sign-in}} supplies the identity and {{roles-permissions|roles and permissions}} supply the rules."
   ],
   [
    "What goes wrong",
    "In 2025 a flaw was filed as CVE-2025-48757 against sites made with Lovable, one of the tools covered in {{ai-app-builders|AI app builders}}. It said an insufficient RLS policy let unauthenticated attackers read or write arbitrary tables of generated sites [4]. Lovable disputes it and says each customer is responsible for protecting their own app's data [4]. Other traps are listed by Supabase. A policy written as to anon using (true) exposes every row the role can reach [2]. Views bypass RLS by default, and on Postgres 15 and newer you set security_invoker = true to fix that [2]. Adding policies does not remove access grants that already exist [2]. The secret key bypasses RLS and must stay off the browser [2][3]. Policies can also be slow, and Supabase advises indexing the columns a policy filters on [2]."
   ],
   [
    "What a careful team does",
    "Turn RLS on in the same migration that creates the table. Deny by default, which OWASP lists among its main ways to prevent broken access control, the number one risk on its 2021 Top 10 [5]. Write tests for each table that check both an allowed case and a denied case for each role, which Supabase supports with pgTAP files and the supabase test db command [2]. Keep the secret key on servers only [3]. Have a second person read every change to a policy. More on the wider habits is in {{security-basics|Security basics}}."
   ]
  ]
 },

  "body": [
   [
    "Ways to sign in",
    "A password is the oldest way. A magic link is an email with a link that signs you in, so there is no password to remember. A one-time code works the same way with a short number. Social sign-in means using an account you already have, such as Google or Apple. Supabase Auth lists password, magic link, one-time password, social sign-in and single sign-on for companies, plus a second step by authenticator app or phone [1]. Firebase Authentication lists email and password, Google, Apple, Facebook, Twitter and GitHub, phone number by text message, and anonymous accounts that can be upgraded later [4]."
   ],
   [
    "Passwords and second steps",
    "The US standards body NIST gives plain rules for passwords. A password used alone should be at least 15 characters, and sites should allow at least 64 [6]. Sites should not force odd mixes of character types or force changes on a schedule, and should check new passwords against lists of known leaked ones [6]. They should allow pasting and password managers, and store passwords salted and hashed [6]. For two-factor sign-in, NIST's second level requires two different factors and requires offering at least one option that resists phishing [6]."
   ],
   [
    "Passkeys",
    "A passkey is a sign-in credential built on FIDO2 standards, stored on a phone, computer or security key [7]. It is a pair of cryptographic keys tied to one account on one site. You sign in by unlocking your device with a biometric, PIN or pattern, and the biometric data stays on the device [7]. The FIDO Alliance calls passkeys phishing-resistant because they hold no shared secret that a server leak could expose [7]. Synced passkeys are backed up through providers such as iCloud Keychain or Google Password Manager, while device-bound ones stay on a single device [7]."
   ],
   [
    "How they compete",
    "Start fast: all five below give you ready-made sign-in. Supabase Auth ties into the database, because the user's token limits database access row by row with RLS rules [1]. Clerk bills on monthly retained users, with 50,000 free per app, and includes organizations with admin and member roles [2]. Auth0 has a free plan for up to 25,000 monthly active users, and its paid plans start at $35 a month for B2C or $150 a month for B2B at 500 users [3]. Firebase offers an optional upgrade called Identity Platform that adds multi-factor sign-in, SAML and multi-tenancy. After the upgrade, the free Spark plan allows 3,000 daily active users, and the pay-as-you-go Blaze plan includes 50,000 free monthly active users and then charges per user [4]. Better Auth is a TypeScript framework that adds 2FA, passkeys and multi-tenancy through plugins [5]. Prices are as of 2026. How hard to leave: the more your data rules lean on one provider's tokens, the more work it is to move."
   ],
   [
    "Common mistakes",
    "One is treating sign-in as the same thing as permission. On Firebase, signed-in users can read and write the Realtime Database and Cloud Storage unless Security Rules restrict them [4]. Another is forcing password changes or composition rules that NIST says to avoid [6]. A third is building password storage by hand when a service does it. Once people can sign in, you decide what they can do, which is the topic of {{roles-permissions|Roles and permissions}} and {{row-level-security|Row-level security}}."
   ]
  ],

  "title": "Roles and permissions",
  "one": "Roles and permissions decide what each signed-in person may do, and on a platform with many customers they also keep one customer's data away from another's.",

  "related": [
   "row-level-security",
   "sign-in-auth",
   "security-basics",

  ],
  "body": [
   [
    "Users, roles and permissions",
    "A permission is one allowed action, such as deleting a message. A role is a named bundle of permissions, such as admin or moderator. Supabase's example keeps a table that links users to roles and another that links roles to permissions like channels.delete and messages.delete [4]. A hook that runs before each login token is issued writes the user's role into the token [4]. Clerk ships admin and member roles and lets you add custom roles for finer control [5]."
   ],
   [
    "Least privilege",
    "NIST defines least privilege as restricting the access of users to the minimum needed to do their assigned tasks [3]. OWASP gives the same advice in two rules. Enforce least privileges, and review permissions over time to catch privilege creep, where people keep access they no longer need [1]. Deny by default, so the app always explicitly allows or refuses a request even when no rule matches [1]."
   ],
   [
    "Organizations and many customers",
    "A multitenant platform is used by many customers, called tenants, and a tenant is not the same as a user, because many users from one company form one tenant [6]. Clerk Organizations model this. A user can belong to several organizations, and the role they hold in the one they are viewing decides what they can do there [5]. For the data, Microsoft's guide lists the main choices. A shared database is the cheapest and easiest to manage, but tenants can slow each other down and the database hits size limits. A separate database per tenant isolates better and costs more [7]. It lists a table per tenant inside one database as an antipattern, and suggests one set of tables with a tenant ID column instead [7]."
   ],
   [
    "Where the check must live",
    "OWASP says to validate permissions on every request, including server-side calls, and to write access control once in trusted server code and reuse it [1][2]. In Supabase the check can sit in the database, where row-level security policies call a function that asks whether the user's role holds a permission [4]. Microsoft notes that row-level security can isolate tenants in a shared Postgres database, but the user and tenant identity must travel with every query, and many multitenant products skip it because that is hard to design and test [7]. The policies themselves are covered in {{row-level-security|Row-level security}}."
   ],
   [
    "Common mistakes",
    "Checking permissions on most requests but not all leaves gaps an attacker can use [1]. Letting a user reach another account by changing an ID in the address is an insecure direct object reference, a standard weakness on OWASP's list [2]. Lists of roles that keep growing are called role sprawl, and OWASP suggests rules based on attributes or relationships when roles stop fitting [1]. Another trap is adding a custom column for one customer's needs, which the Azure guide says quickly becomes unmanageable [7]. Sign-in comes first, in {{sign-in-auth|Sign-in and accounts}}."
   ]
  ]
 },

  "body": [
   [
    "Public and private files",
    "In a public bucket, anyone with the file's URL can fetch it without an access check. In a private bucket, every operation is checked against rules [2]. Supabase makes new buckets private by default, and uploads need access control in both kinds [2]. Vercel Blob works the same way with public and private stores, and you cannot change a store's mode after you create it [6]. Choose private for anything personal, such as ID scans or invoices."
   ],
   [
    "Signed links",
    "A signed link gives time-limited access to one private file without opening up the whole bucket. Amazon calls them presigned URLs [3]. They work like a key: Amazon describes them as bearer tokens that give access to whoever holds them, so they should be protected [3]. In the S3 console the expiry can be set from 1 minute to 12 hours, and with the command line or a code kit it can go up to 7 days [3]. A signed link can also let someone upload one file without having an account [3]. Supabase signed URLs grant access for a limited time too [2]. Use short expiry times."
   ],
   [
    "What each option is",
    "Supabase Storage is S3-compatible file storage that keeps file details in Postgres, uses RLS to control access, and serves files through a CDN [1]. Amazon S3 is Amazon's file storage service [3]. Cloudflare R2 lists $0.015 per GB-month for standard storage, with a free tier of 10 GB, 1 million Class A operations and 10 million Class B operations each month [5]. Vercel Blob stores files up to 5 TB, runs on top of Amazon S3, and quotes 99.999999999 percent durability [6]. Backblaze B2 starts at $6.95 per TB per month and calls itself S3-compatible [7]."
   ],
   [
    "How they compete",
    "Start fast: Supabase Storage and Vercel Blob sit next to your database or host [1][6]. Cost as you grow: the surprise is usually the cost of sending files out, not storing them. Cloudflare says there are no charges for egress, which is data leaving storage, from R2 [5]. Backblaze gives free egress up to three times your average monthly storage, then $0.01 per GB [7]. Vercel Blob charges data transfer on downloads [6]. Amazon makes the first 100 GB a month of data sent to the internet free across all AWS services, with tiered charges after that [4]. Video and large files make this matter most. How hard to leave: Supabase and Backblaze both use the S3 style of connection [1][7], so moving files between providers is mostly a copy job."
   ],
   [
    "Common mistakes",
    "Putting private files in a public bucket is the big one, since anyone with the URL can fetch them [2]. Long-lived signed links are the next, because they keep working until they expire, even if you no longer want them to [3]. Another is uploads through your own server. Vercel notes that client uploads carry no data transfer charge, while server uploads incur Fast Data Transfer charges [6]. Set a size limit on uploads before anyone can upload video. How files fit into a page is covered in {{files-images|Files and images}}, and the risk of losing them in {{backups-restore|Backups and restore}}."

  "body": [
   [
    "Why a plain filter is not search",
    "Postgres explains why simple pattern matching falls short. It has no understanding of word forms, so satisfies and satisfy do not match. It gives no ranking of results, and it is slow because it has no index to use [1]. Full-text search fixes this by turning each document into normalized words, matching a query against them, ranking results by how well they match, and using indexes to speed it up [1]."
   ],
   [
    "Search inside Postgres",
    "Supabase supports this with Postgres functions. to_tsvector turns text into searchable words, and websearch_to_tsquery reads user-style input including quoted phrases, the word or, and a dash to leave a word out [2]. A generated column can keep a prepared copy of the searchable text up to date, and a GIN index makes queries faster [2]. The Postgres page describes word forms, ranking and indexes. It does not describe typo tolerance, which Typesense and Meilisearch both list as a feature [1][4][5]. The data side is covered in {{postgres-basics|Postgres basics}}."
   ],
   [
    "Separate search engines",
    "Algolia is a paid search service. Its free plan covers 10,000 search requests and 50,000 records a month, and its pay-as-you-go plans charge extra per thousand search requests and per thousand records [3]. Typesense is open source and typo-tolerant, runs in memory, and can be run on your own server with Docker or as the paid Typesense Cloud [4]. Meilisearch offers typo tolerance, search as you type, and a mix of keyword and meaning-based search, as a single program you host yourself or as Meilisearch Cloud with a 14-day free trial [5]. Elasticsearch is a distributed search and analytics engine for full-text, fuzzy, meaning-based and mixed search, and it is also used for logs. It is sold as Elastic Cloud or run by you [7]."
   ],
   [
    "Search by meaning",
    "Vector search finds items that mean something similar, even with different words. pgvector adds this to Postgres, so vectors sit next to your other data [6]. Exact search is the default and is perfectly accurate, while approximate indexes such as HNSW and IVFFlat trade some accuracy for speed [6]. One catch is that with an approximate index the filter runs after the index is searched, so a query can return fewer rows than you asked for [6]. Typesense and Meilisearch also list vector or meaning-based search [4][5]. How AI uses this is covered in {{rag|Retrieval-augmented generation}}."
   ],
   [
    "How they compete",
    "Start fast: Postgres search is already inside your database, so there is nothing new to run [2]. Cost as you grow: Algolia charges by use [3], while Typesense and Meilisearch can be run yourself or bought as a cloud service [4][5], and Elasticsearch offers both ways too [7]. How hard to leave: a search engine keeps its own copy of your data, so the work to plan for is keeping that copy in step with the database. Postgres search has no second copy to manage."
   ]
  ],

  "id": "realtime",
  "cat": "data",
  "title": "Realtime updates",
  "one": "Realtime means a screen updates by itself when something changes, with no refresh by the visitor.",
  "src": [
   "realtime_1",

   "realtime_3",

  "related": [
   "backend-database",

   "row-level-security"
  ],
  "body": [
   [
    "Asking again and again, or being told",
    "The old way is polling, where the page keeps asking the server whether anything is new. A WebSocket removes the need. It opens a two-way session between the browser and a server, so messages and replies flow without polling [1]. The session starts with an HTTP handshake and then stays open, and either side can send at any time [1]."
   ],
   [
    "WebSockets and server-sent events",
    "A WebSocket suits chat and shared editing, where both sides talk. MDN warns that WebSockets have no backpressure, which means that if messages arrive faster than the app can handle them, the app can fill its memory or lock up [1]. Server-sent events are the simpler option when only the server talks. They are a one-way stream from server to browser over plain HTTP, and they reconnect on their own if the link drops [2]. Without HTTP/2, a browser allows only about 6 such connections per domain, shared across all tabs [2]."
   ],
   [
    "How Supabase does it",
    "Supabase Realtime has three parts. Broadcast sends low-latency messages between clients, for things like chat and cursors. Presence shares who is online. Postgres Changes reports changes made in the database [3]. Postgres Changes applies RLS to what each person receives, but delete events are sent regardless of policy [4]. Every event is checked against every subscriber, and changes are processed on a single thread [4]. Supabase recommends Broadcast instead once there are more than about 3,000 concurrent subscribers on the same changes [4]. The rules behind this are in {{row-level-security|Row-level security}}."
   ],
   [
    "How they compete",
    "Start fast: Supabase Realtime comes with your project [3]. Pusher Channels is a hosted WebSocket service with presence channels, and its free Sandbox plan allows 200,000 messages a day and 100 connections at once [5]. Ably's free tier allows 6 million messages a month and 200 connections at once, and its Standard plan is $29 a month plus usage, with messages at $2.50 per million [6]. Firebase Realtime Database syncs JSON data to every connected client, works offline, and guards data with Security Rules [7]. Cost as you grow: the paid services bill by messages and connections, so costs rise with traffic. How hard to leave: Pusher and Ably carry messages only [5][6], while Firebase's Realtime Database stores the data too, and Firebase itself points to Cloud Firestore for apps that need richer data models [7]."
   ],
   [
    "Common mistakes",
    "Using Postgres Changes for a large audience runs into the single-thread limit [4]. Assuming RLS hides deleted rows is another, since deletes are sent regardless of policy [4]. Ignoring backpressure on WebSockets can freeze a page [1]. Opening many server-sent streams without HTTP/2 runs into the browser limit [2]. The last is using realtime where it is not needed. Many screens only need to refresh after the visitor acts, and that costs less. For notifications to a phone, see {{alerts-push|Alerts and push notifications}}."
   ]
  ],
  "compare": "realtime"
 },
 {
  "id": "backups-restore",
  "cat": "data",
  "title": "Backups and restore",
  "one": "A backup only counts once you have restored from it, and a careful team practices that before disaster strikes.",
  "src": [
   "backups_restore_1",
   "backups_restore_2",
   "backups_restore_3",
   "backups_restore_4",
   "backups_restore_5"
  ],
  "related": [
   "postgres-basics",
   "backend-database",
   "file-storage",
   "environments-previews"
  ],
  "body": [
   [
    "A copy is not always a backup",
    "In 2017 an engineer at GitLab, rebuilding a database copy that had fallen behind, wiped the main database by mistake and removed about 300 GB before stopping [3]. The outage lasted about 18 hours and the loss was roughly 5,000 projects, 5,000 comments and 700 user accounts [3]. The regular backups had failed or could not be used, and recovery came from a snapshot someone took by hand about six hours earlier, which took about 18 hours to copy over [3]. One of GitLab's lessons was that replicas are not backups [3]."
   ],
   [
    "Daily backups and point-in-time recovery",
    "Supabase gives Pro, Team and Enterprise projects daily backups, kept for 7, 14 and up to 30 days [1]. Point-in-time recovery, called PITR, is a paid add-on that lets you go back to a chosen moment. It uses physical snapshots plus a log of every change, backed up every two minutes by default, so the worst case is losing about two minutes [1]. It costs about $100 a month for 7 days of history, and turning it on stops the daily backups [1]. In Postgres itself, PITR works by combining a base backup with archived write-ahead log files and replaying them up to the time you pick [2]. It restores the whole cluster, not one database [2]."
   ],
   [
    "What a backup may not include",
    "Supabase backups do not include Storage files, since the database holds only details about them [1]. Daily backups do not store passwords for custom roles, so you reset them after a restore [1]. Deleting a project permanently removes its backups too [1]. Free projects have no automatic backups, so Supabase advises exporting data regularly with supabase db dump and keeping copies elsewhere [1]. Neon's restore overwrites every database in the branch, but it first saves the old state as a backup branch, and Object Storage and Functions are not reverted [5]. See {{file-storage|File storage}} for the files side."
   ],
   [
    "Test the restore",
    "GitLab's postmortem lists what went wrong, and it reads like a checklist. The daily dump failed because the tool was a different version from the database, the failure emails were rejected, and the storage bucket was empty. Nobody owned the backup process, so it was never tested [3]. The US cyber agency CISA advises keeping offline, encrypted backups, because ransomware searches for backups it can reach and deletes or encrypts them, and says to test backup procedures regularly [4]."
   ],
   [
    "What a careful team does",
    "Write down how to restore and who does it. Alert on backup failures rather than relying on email that may be rejected [3]. Keep one copy off the host that runs the database [1][4]. Restore into a new project from time to time, which Supabase supports through its Duplicate Project feature [1]. Time the restore, because the project is inaccessible during a restore and downtime grows with database size [1]. Ask the question \"how much data could we lose, and how long would we be down\" before it matters. A practice copy of the database makes the rehearsal safe, as covered in {{environments-previews|Environments and previews}}. The database side is in {{postgres-basics|Postgres basics}}."
   ]
  ]
 },

    "What a host does",
    "You give a host your code. It builds the site and puts it on the internet at a web address. On Vercel, a deployment is the result of a successful build of your project, and each deployment gets its own web address so you can look at changes before they go live [1]. Vercel, Netlify and Render all work this way: you save your code to GitHub and they rebuild the site on their own [1][3][7]."
   ],
   [
    "Files, or code that runs",
    "Some hosts only hand out finished files, called a static site: pages made of HTML, CSS and JavaScript. GitHub Pages does exactly this, straight from a GitHub repository [6]. Other jobs need code that runs on a server, such as checking a sign-in with a {{backend-database|backend}} or calling an AI (see {{ai-inside-apps|Putting AI inside an app}}). Render splits these into two kinds of service: a static site for plain files, and a web service for a dynamic app [7]. Vercel, Netlify and Cloudflare all let you add small server pieces next to your pages, which they call functions [2][3][4]."

   [

    "Vercel deploys on every commit or pull request from GitHub, GitLab, Bitbucket or Azure DevOps [1]. Netlify offers the same push-to-deploy, a private preview link for every pull request, and one-click rollback to an older deploy [3]. Cloudflare Pages deploys from Git, by uploading files directly, or from the command line [4], and Cloudflare now says Workers covers most Pages use cases and tells people to start new projects with Workers [4]. Render also sells its own Postgres databases beside its hosting [7]. GitHub Pages is the simplest: one site per account or per repository [6]."
   ],
   [

    "Start fast: Vercel and Netlify both let you drop a folder into a web page and deploy with no Git setup [1][3]. Cost as you grow: Vercel's free Hobby plan is limited to personal, non-commercial use [2], while on Cloudflare, requests for plain static files are free and unlimited on both free and paid plans [5]. GitHub Pages is free for public repositories, and private ones need a paid GitHub plan [6]. Render's static sites count against a monthly allowance of bandwidth and build minutes [7]. How hard to leave: a plain static site is just files, so it moves anywhere easily, and the lock-in grows with each feature that only that host offers, like its own functions."

    "What a scheduled job is",
    "The timing is written in a short code called a cron expression [3]. For example, one pattern means 'every day at 5 a.m.' The real choice is where the job runs: in your code host, your web host (see {{hosting|Website hosting}}), your database, or a separate service built for the purpose. Each place has its own limits, and the limits are what to read before you pick one."

  "body": [
   [
    "What Git is",
    "Git is a version control system. It tracks the history of changes as people work, so earlier versions can be recovered at any time [3]. Every developer holds a full copy of the project and its history, so Git does not need a constant link to a central server [3]. Each time you commit, Git records a snapshot of what all the files look like at that moment [1]. Most Git actions add data instead of erasing it, so committed work is very hard to lose, especially if you push it to another copy regularly [1]."
   ],
   [
    "Commits and branches",
    "A commit stores a pointer to the snapshot, the author's name and email, a message, and a pointer to the commit before it [2]. A branch is a lightweight, movable pointer to a commit [2]. Making a branch is as quick as writing 41 bytes to a file, so a branch for every task costs almost nothing [2]. GitHub's own workflow starts the same way: create a branch so your work stays off the default branch while collaborators can still see it [5]."
   ],
   [
    "Git and GitHub, and pull requests",
    "Git keeps the history, and GitHub hosts Git repositories and adds issues, pull requests and code review on top [3]. A pull request is a proposal to merge your changes into the project, with a place to discuss and review them first [4]. Reviewers read the Files changed tab, which shows the difference, and the Checks tab, which shows automated tests and builds [4]. After the merge, GitHub says to delete the branch, and the pull request and commit history are kept, so a deleted branch can be restored [5]. {{environments-previews|Environments and previews}} covers how a host can turn each pull request into a preview site."
   ],
   [
    "Why history matters",
    "Every change is a commit with an author and a message, so the project keeps a record of who changed what and why [2]. Everything is checksummed before it is stored, so Git detects it if a file or folder changes without Git knowing [1]. When a merged change breaks something, the Revert button on the pull request creates a new pull request that reverses the original merge [7]. The change is only undone after you merge that new pull request [7]. If the revert hits conflicts, or the original was not merged on GitHub, someone may need to revert individual commits by hand [7]."
   ],
   [
    "What a careful team does",
    "A careful team protects its main branch with rules. GitHub protected branches can require a set number of approving reviews, require status checks to pass, block force pushes and deletions, and require a successful deployment before merging, though by default admins are exempt unless a setting applies the rules to them too [6]. Teams keep each commit to one complete change and put unrelated changes on separate branches [5]. When an AI coding tool writes the change, the pull request is still the place to read what actually changed, and {{working-with-ai-coders|Working with AI coders}} covers that habit. Keep passwords and keys out of commits, because Git generally only adds data [1], as {{secrets-env|API keys and secrets}} explains."
   ]
  ]

   [
    "The usual environments",
    "Vercel has three built in: Local, Preview and Production [1]. Local is your own computer, where you build and test changes [1]. Preview lets you test in a live setting without affecting your live site [1]. Production is the final, user-facing version on your real domain [1]. Pro and Enterprise teams can add custom environments for longer-running needs such as staging or QA, and every environment can hold its own variables, such as database connection details or API keys [1]."
   ],
   [
    "Preview deployments",
    "By default, Vercel makes a preview when you push to any branch that is not your production branch, open a pull request, or deploy from the command line without the production flag [1]. Each preview gets its own web address, either a branch address that always shows the latest on that branch or a commit address that shows one exact version [1]. Pushing or merging to the production branch, commonly main, is what starts a production deployment [1]. That is why the branch and the pull request from {{git-github|Git and GitHub}} matter: they are what create the preview. One catch is that the first deployment of a new project is always a production deployment, even when it comes from another branch [1]."
   ],
   [
    "Why live data stays separate",
    "A preview is a real running copy, so if it points at the live database, testing can change real records. Vercel notes that a staged production deployment uses production variables, so testing can reach production services and data, and says to use a custom environment or a preview branch with staging credentials when you need separate resources [1]. Supabase recommends separate projects for staging and production, and says the staging project should be new instead of one edited to match production [2]. A Supabase branch is a separate environment with its own instance and API credentials, and it starts with no data from the base project unless you add a seed file or choose to include data [3]. OWASP says to keep settings consistent across development, QA and production, but to use different credentials in each [5]."
   ],

   [

    "The twelve-factor method says settings that change between deploys, such as database handles and credentials for outside services, must be kept strictly separate from code [4]. A changed variable does not reach old deployments, only new ones [6]. Preview variables apply to every non-production branch, and a branch-specific value overrides a preview variable with the same name [6]. Variables set only for Preview are not available to a project's first deployment, which builds with Production variables [1]. The fix for most surprises is the same: write down which environment holds which values, and redeploy after changing one, while {{secrets-env|API keys and secrets}} covers handling the values themselves."

 {

  "body": [
   [
    "What counts as a secret",
    "A secret is a value that lets software act with your authority, like an API key, a database password or a token. The twelve-factor method says anything that changes between deploys, including credentials for outside services, is config and must stay strictly separate from code [5]. Its test is simple: if you could publish the code at any moment without leaking a credential, you have done it right [5]. Environment variables are the usual way to do this, and on Vercel they are key-value pairs set outside your source code and encrypted at rest [4]. Compared with config files, they are rarely committed by accident [5]."
   ],
   [
    "Keys you can show and keys you cannot",
    "Supabase's publishable key is low in privilege and safe to ship in web pages, mobile apps and source code, because Row Level Security decides what it can reach [3]. Its secret key is for servers only, and it bypasses every Row Level Security policy, which {{row-level-security|row-level security}} explains [3]. Supabase answers a secret key used in a browser with an HTTP 401 error, and its docs say never to use one in a browser, even on localhost [3]. On Vercel, a variable marked Secret becomes write-only after saving, while Config values stay readable to people with project access [4]."
   ],
   [
    "What happens when one leaks",
    "Anyone who holds a leaked key can act as your app until the key is revoked. GitHub secret scanning checks the full history of every branch for hardcoded credentials such as API keys, passwords and tokens [2]. It runs automatically and free on public repositories, and on private organization repositories it needs GitHub Secret Protection [2]. GitHub's advice is to rotate the credential immediately, and it says wiping the secret from Git history takes significant effort and is often unnecessary once the credential is revoked [2]. OWASP also says exposed keys should be revoked immediately [1]."
   ],
   [
    "Rotating a key",
    "Rotating means issuing a new key and retiring the old one. Supabase lists the order: fix the root cause of the leak, create a new secret key, replace it in every component that uses the old one, confirm each one works, and only then retire the old key [3]. Deleting a Supabase secret key cannot be undone, but the legacy anon and service_role keys, which Supabase is deprecating by the end of 2026, can be deactivated instead, and that can be reversed [3]. On Vercel, a changed variable applies only to new deployments, so redeploy after you rotate [4]. OWASP suggests rotating on a schedule, and automating it when you can, so a stolen credential has limited value [1]."
   ],
   [
    "What a careful team does",
    "A careful team keeps secrets in one managed place, gives each person only the secrets their job needs, and records who had access [1]. OWASP says engineers should not have access to every secret and that secrets should never be retrievable by everyone and everything [1]. It also recommends catching secrets before they are committed, for example with pre-commit hooks [1]. Each environment gets its own values, and Vercel lets you choose which environments each variable applies to [4], as {{environments-previews|Environments and previews}} shows. Tell your AI coding tool to read keys from the environment and never to print them or write them into files that get committed."
   ]
  ]

  "body": [
   [
    "Why work moves to the background",
    "A web request should answer in a moment. Vercel Queues lists the usual reasons to hand work off: sending emails, making PDFs and calling outside APIs, so the reply returns fast [7]. A queue can also absorb traffic spikes and retry work that failed [7]. Short-lived server code has hard limits: a Supabase Edge Function gets 2 seconds of actual CPU time per request, and on the hosted platform its wall-clock time is 150 seconds on the free plan and 400 on paid plans [1]. Long work, such as an {{ai-inside-apps|AI call}}, needs a place without those limits, and it differs from a {{scheduled-jobs|scheduled job}}, which starts at a set time instead of because something just happened."
   ],
   [
    "Queues and workflow tools",
    "A queue holds messages until a worker handles each one. Supabase Queues is a queue built into Postgres on the open-source pgmq extension, with guaranteed delivery and delivery once within a set visibility window [5]. Vercel Queues keeps messages in durable topics with automatic retries and at-least-once delivery, and it is in Beta on all plans [7]. At-least-once means the same job can arrive twice, so a job should be safe to run again [7]. Workflow tools go further: Inngest saves the result of each step and retries only from the step that failed [2], and Trigger.dev tasks run on Trigger.dev's own servers instead of inside your serverless functions, with no maximum duration by default [4]."
   ],
   [
    "What each one is known for",
    "Inngest is a platform for durable workflows: you add steps to functions in your own code, and failed work is retried from the failed step [2]. Trigger.dev is open source, with an Apache-2.0 core and an MIT SDK, and you can self-host it with Docker or Kubernetes or use Trigger.dev Cloud [4]. It can limit how many runs execute at once, globally or per tenant [4]. Upstash QStash sits between your app and a web address you control: you publish a message with one authenticated HTTP request, and QStash delivers it, retries failures, and can schedule delivery for later [6]. Supabase Queues keeps jobs in your own database and uses Row Level Security and API permissions to control who can reach a queue [5]."
   ],
   [
    "How they compete",
    "Start fast: QStash needs only an authenticated HTTP request and your token, with no servers to run [6], and a Supabase queue is created and watched in the dashboard with standard Postgres tools [5]. Cost as you grow: Inngest's free plan includes 50,000 executions a month, where one run costs one execution plus one per step, so a five-step job uses six, and its Pro plan is $99 a month [3]. How hard to leave: a queue in Postgres uses standard tools [5], while code written for Inngest's or Trigger.dev's step model depends on their libraries [2][4]. Trigger.dev can be run on your own servers, which lowers the risk of being stuck [4]."
   ],
   [
    "Common mistakes",
    "Jobs fail quietly unless someone looks. Trigger.dev marks a run FAILED after its retries run out, and some crashes, such as running out of memory, end as CRASHED with no retry [4]. Send those failures to an error tracker, as {{monitoring-errors|Error tracking and monitoring}} describes. Duplicates are the other trap: Trigger.dev and Vercel Queues both offer idempotency keys, which stop the same trigger or publish from running twice [4][7]. A QStash message has a default size limit of 1 MB, so pass an ID and fetch the data inside the job [6]."
   ]
  ],
  "compare": "background-jobs"
 },

   [
    "Push and local",
    "Apple's notification docs cover two kinds, local and push. A local notification is scheduled by the app itself, and a push notification is sent from a server. Both can reach people whether your app is running in the background or inactive, and both can show a message, play a sound, or change the badge on the app icon [3]."
   ],
   [
    "On the web",
    "The Push API lets a web app receive messages from a server whether or not the app is in the foreground or even loaded [1]. It needs an active service worker, which is a small background script in the browser [1]. Each subscription has a secret web address, and anyone who learns it could send messages to your app, so it must be kept private [1]. On iPhone, Web Push works for web apps that a person has added to the Home Screen, and the app can ask permission only after the person taps something like a subscribe button [2]."
   ],
   [
    "In native apps and services",
    "Apple's push system is called APNs, and its Push Notifications Console lets you send test pushes and see delivery numbers [3]. Firebase Cloud Messaging sends notifications and messages to users on Android, iOS and the web [4]. Capacitor's push plugin needs the Push Notifications capability turned on in iOS, and on Android it uses Firebase Cloud Messaging [6]. OneSignal is a service that sends mobile push, web push, email and in-app messages [5]. Its free plan includes all channels with basic automation and analytics [5]."
   ],
   [
    "How they compete",
    "Start fast: a service like OneSignal or Firebase Cloud Messaging wraps the hard parts for several platforms at once [4][5]. Cost as you grow: OneSignal starts free and moves to paid plans as your needs grow [5]. How hard to leave: a third-party service stores your subscribers, so moving later means moving that list. Building directly on the Push API avoids that, but then you run the sending server yourself [1]."

 {
  "id": "monitoring-errors",

  "title": "Error tracking and monitoring",
  "one": "Monitoring is how you find out something broke before your users tell you, using error tracking, logs and uptime checks.",

  "body": [
   [
    "Three ways of watching",
    "Error tracking catches a crash and shows where it happened. Sentry, for example, captures errors, logs, traces, replays, profiles and metrics from an app, and a connected source repository adds suspect commits that point to the change most likely to have caused an error [1]. Logs are the app's running diary, and on Vercel the runtime logs include the output of function runs, including anything the code prints with console.log [5]. Uptime checks come from outside and ask whether the site answers at all. Better Stack's checks cover web pages, APIs, SSL, domain expiration, DNS and cron jobs [3]."
   ],
   [
    "What is worth watching",
    "Google's SRE book names four signals to watch: latency (time to serve a request), traffic (demand on the system), errors (the rate of failed requests) and saturation (how full the limiting resources are) [7]. It says alerts should be about problems users can see, such as failing requests, while causes like a refused database connection are for debugging [7]. Every page should be actionable, because too many noisy alerts teach people to ignore them [7]. Jobs need their own watching, since nobody sees a {{background-jobs|background job}} fail, and Sentry offers cron monitors for scheduled jobs [1]."
   ],
   [
    "What each one is known for",
    "Sentry ties errors to your code, and its alerts can go to Slack, Discord, PagerDuty, Jira, Linear or GitHub Issues [1]. Better Stack Uptime can check as often as every 30 seconds, runs real Chrome browser tests, and sends alerts by SMS, email, Slack, Teams, push notification and voice call [3]. Vercel Observability is built into the host: it helps you find production errors, capture request traces and see metrics from the dashboard or command line, on all plans [4]. Its runtime logs can be searched by route, status code, environment and branch [5]. UptimeRobot's free plan is described as good for hobby and non-profit projects [6]."
   ],
   [
    "How they compete",
    "Start fast: Vercel Observability needs nothing installed because it is included on all plans [4], while Sentry asks you to add its SDK and switch on options such as tracesSampleRate [1]. Cost as you grow: Sentry's free Developer plan lists 5k errors, one user, one uptime monitor and a 30-day lookback, and its Team plan is $29 a month billed monthly [2]. Better Stack's free tier has 10 monitors, 10 heartbeats and a status page with checks every 3 minutes [3], and UptimeRobot's free plan has 50 monitors with 5-minute checks [6]. Logs are where hosts differ most: Vercel keeps 1 hour of runtime logs on Hobby, 1 day on Pro, and 30 days on Pro with Observability Plus [5]. How hard to leave: uptime monitors are a list of web addresses, so they move easily, while an error tracker's SDK lives in your code and takes edits to swap [1]."
   ],
   [
    "What a careful team does",
    "Set up an uptime check on the home page and on one page that needs the database, so a database outage shows up as an outage. Send alerts to a place a person actually reads, and remove the ones nobody acts on [7]. A Vercel Hobby project keeps only an hour of runtime logs, so an overnight problem may be gone by morning [5]. Connect the error tracker to your repository so each error points at a recent change [1]. Review the alerts every few weeks, while {{alerts-push|Alerts and push notifications}} covers the messages your own users receive."
   ]
  ],

 },
 {

    "Site analytics answers who is visiting and from where. Vercel Web Analytics shows top pages, referrers, and visitors' location, operating system and browser [4]. Product analytics answers what people do once inside, such as where they drop out of sign-up. PostHog lists product analytics, web analytics, session replay, feature flags, experiments and surveys in one platform [3]. Which kind you need depends on the question you are asking, and {{seo|search visibility}} and {{performance-web-vitals|page speed}} are measured separately."

   [
    "The privacy trade-off",
    "Some tools recognize a visitor with a cookie, which lets them follow one person over time. Google Analytics mainly uses first-party cookies to report on visitor interactions [5], and Google says it does not log or store IP addresses [5]. Plausible says it uses no cookies or persistent visitor identifiers, and it counts unique visitors with a daily hash of a salt, the domain, the IP address and the browser, with the salt rotated and deleted every 24 hours [1]. Vercel Web Analytics identifies visitors by a hash made from the request that lasts a day, so people cannot be tracked between days or between sites [4]. Less tracking means less detail, and what a banner must say depends on the law, which {{privacy-compliance|Privacy policies and compliance}} covers."

   [

    "Plausible charges from $9 a month after a 30-day trial, and says its code is open source and you can run it yourself [2]. PostHog's code is under the MIT license apart from an ee directory, it offers a self-hosted hobby version, and its cloud service has monthly free allowances [3]. Google Analytics keeps event data for 2 or 14 months on standard properties and offers the same two choices for user-level data [6], and Google's contracts forbid sending personally identifiable information to it [5]. Vercel Web Analytics is built into the platform, needs no third-party service, and does not count traffic from bots, which it detects from the user-agent header [4]."

    "The list teams use",
    "The OWASP Top 10:2025 names ten web application risks in order: broken access control, security misconfiguration, software supply chain failures, cryptographic failures, injection, insecure design, authentication failures, software or data integrity failures, security logging and alerting failures, and mishandling of exceptional conditions [1]. In plain words, they cover people reaching things they should not, settings left open, risky code from outside packages, weak protection of data, input treated as commands, flawed plans, weak sign-in, tampered updates, attacks nobody notices, and sloppy error handling [1]. The next sections cover the ones that most often catch small apps."
   ],
   [
    "Broken access control",
    "Broken access control ranks first in the 2025 list, and OWASP found some form of it in 100% of the applications it tested [2]. Typical cases are changing an account ID in a request to see another person's account, reaching admin pages by guessing the address, and hiding admin features in the front end, which anyone can bypass by sending the request directly [2]. Supabase warns that a table with Row Level Security switched off is readable and writable by any role with a grant, and that with it on and no policies, nothing is reachable through the publishable key [6]. OWASP's cure is to deny by default except for public things, check on the server and not only in the browser, and write the access-control code once and reuse it [2]. {{row-level-security|Row-level security}} and {{roles-permissions|roles and permissions}} cover how that looks in practice."

   [

   [
    "What counts as personal data",
    "This is plain-words background, not legal advice. Under the EU's GDPR, personal data is any information about an identified or identifiable living person, and examples include names, email addresses, IP addresses and cookie IDs [1]. GDPR covers organisations in the EU, and also organisations outside it that offer goods or services to people in the EU or monitor their behaviour there [1]. A site built in the US can fall under it when it serves people in the EU [1]."
   ],
   [
    "Privacy policies and people's rights",
    "A privacy policy is the page that says what you collect, why, who receives it and how people can ask you to stop. The FTC's COPPA guide gives a typical list: who collects data, what is collected and how it is used, how long it is kept, and what rights parents have [7]. Under California's CCPA, people can ask what a business holds about them, ask it to delete or correct that data, opt out of its sale or sharing, and limit the use of sensitive data [5]. A business must honor an opt-out sent through a browser signal such as Global Privacy Control, and it has 45 calendar days to answer requests to know, delete or correct [5]. The policy has to match what the product really does, so recheck it whenever you add a tool, such as an {{analytics|analytics}} script."

    "Bots go after the places that cost you money or open doors. Vercel lists the attacks its bot checks guard against as credential stuffing, brute force, data scraping, API abuse, spam and fraud, and bots that consume expensive bandwidth, compute or inventory [5]. Google's reCAPTCHA describes detecting credential stuffing, account takeover and automated account creation [3]. Every fake sign-up can cost real money, through emails sent and users billed, as {{email-sending|Sending email}} and {{costs-at-scale|Costs as you grow}} explain."

    "A check asks the visitor's browser to prove it is probably human. Cloudflare Turnstile does this with small non-interactive checks, so most visitors never solve a puzzle [1]. A rate limit counts requests from the same source and blocks the extra ones [6]. Vercel's rule defaults to 100 requests in a 60-second window and answers with a 429 error by default, and its counters are kept per region, so traffic spread across regions can pass the limit [6]. Supabase Auth already limits sign-ups, sign-ins and similar calls to 30 requests per 5 minutes per IP address, and its built-in email provider sends only 2 emails per hour [7]."

    "What responsive design is",
    "Responsive web design is an approach that makes pages render well on all screen sizes while staying easy to use [1]. MDN says it is not a separate technology, and that the term was coined by Ethan Marcotte in 2010 [1]. He described it as fluid grids, fluid images and media queries working together [1]. The key idea is that you do not draw one layout per device. You build layouts that bend."

    "Fluid layouts, then breakpoints",
    "Responsive sites are built on flexible grids, so you do not have to target every device size with a pixel-perfect layout [1]. Flexbox and CSS Grid are responsive by default [1]. A breakpoint is the width at which a media query changes the layout [1]. MDN describes mobile first as starting with a simple single-column layout and adding columns for wider screens [1]. web.dev advises choosing breakpoints based on your content rather than popular device sizes, because device sizes change with every technology release cycle [4]. Its example switches to two columns at 50em, where lines of text become too long to read comfortably [4]."

  "body": [
   [
    "The three numbers",
    "Google's Core Web Vitals are Largest Contentful Paint (LCP), Interaction to Next Paint (INP) and Cumulative Layout Shift (CLS) [1]. LCP is the time until the largest image, text block or video in view is drawn, and it should be 2.5 seconds or less [1][2]. INP measures how fast a page reacts to clicks, taps and key presses, and should be 200 milliseconds or less [1][3]. CLS measures how much content unexpectedly moves, and should be 0.1 or less [1][4]. A page passes when it meets the targets for at least 75% of visits, checked separately for mobile and desktop [1]."
   ],
   [
    "What slows sites down",
    "For LCP, the causes include a slow server response, a large image that loads late, and text held back while a web font loads [2]. Google's guide says never to lazy-load the LCP image, and to mark it with fetchpriority high [5]. For INP, the usual cause is long tasks on the main thread, where JavaScript blocks the page from reacting [3]. For CLS, the common causes are images or videos without set dimensions, fonts that change size, third-party ads that resize, and content inserted above what the reader is viewing [4]. The fix is to reserve space for anything that loads later [4]. Caching and a content network help the first cause, see {{caching-cdn|Caching and CDNs}}, and image handling is covered in {{files-images|Files and images}}."
   ],
   [
    "How to measure",
    "There are two kinds of data. Field data comes from real visitors, and all three vitals are mainly field metrics [1]. Lab data comes from a simulated test, which suits development but is not a substitute for field data [1]. Lighthouse, the lab tool, cannot measure INP because no user input happens in a test, so it reports Total Blocking Time as a stand-in [1]. PageSpeed Insights shows both: a Lighthouse score from 0 to 100, with 90 and up counted as good, and real-user results from Chrome over the last 28 days [6]. If a page has too little traffic, it falls back to data for the whole site [6]."
   ],

    "Does it affect search ranking?",
    "Google says it highly recommends good Core Web Vitals for success in Search, and that page experience aligns with what its core ranking systems seek to reward [7]. It does not call them a direct ranking factor, and it does not promise that good scores guarantee a top spot [7]. Treat them first as a quality target for your visitors. See {{seo|Search engine basics}} for the rest of what Google looks at."
   ],

    "What a careful team does",
    "A careful team measures a few key pages on every release, with a phone-sized test first, rather than looking only at a fast office laptop. Google also warns that cached test files and fast local APIs can hide layout shifts, so it tests under production-like conditions [4]. It sets a limit on third-party scripts and watches the biggest image on each page. Layout is part of this too, see {{responsive-design|Designing for every screen size}}."

    "What an API is",
    "An API is a connection that lets one piece of software talk to another, and it exposes the parts a programmer needs while hiding the inner details [1]. A web API works over the internet [1]. Your program sends a request, and the other side sends back a reply in a format such as JSON [1]. When an app answers a question with AI, it sends your text to the AI company's API and shows what comes back."
   ],
   [
    "What it takes to use one",
    "Anthropic's API is a web API at api.anthropic.com [3]. The main part is the Messages API, where you send a conversation and get Claude's reply, and you need an account and an API key [3]. Accounts sit in usage tiers with monthly spend limits and limits on requests and tokens per minute [3]. You can split work into workspaces to separate environments and control spend [3]. See {{what-it-costs|what AI costs to run}}."
   ],
   [
    "What an SDK is",
    "An SDK, or software development kit, is a bundle of tools and code packaged for easy install [2]. Anthropic's official SDKs for Python, TypeScript, C#, Go, Java, PHP and Ruby handle the sign-in headers, retries after errors and streaming, which shows an answer as it is written [3]. The Vercel AI SDK is a TypeScript toolkit that gives one consistent way to use models from different companies, so you do not have to handle each company's details [6]. Anthropic's advice to builders is to try the API directly before adding a framework [7]. Frameworks can hide the prompts and replies you need to see [7]."
   ],
   [
    "Keep the key secret",
    "An API key is like a password that also runs up a bill. The Twelve-Factor App guide says to keep config such as credentials out of your code and in environment variables [4]. Its test is whether you could open-source the code at any moment without leaking a secret [4]. GitHub's secret scanning looks through a repository's history for hard-coded keys, and its advice for an exposed key is to rotate it right away [5]. Call the AI from your server, not from code that runs in a visitor's browser."

   [
    "How forecasts are made today",
    "Traditional forecasting starts from observations of the atmosphere, collected from stations, buoys, balloons, satellites, radar, aircraft and ships [6]. Supercomputers then solve physics equations step by step to project the weather forward [6]. These models improve mostly by adding more computing power, because they cannot directly use past weather data to improve themselves [1]."

   [
    "What the AI models do",
    "Machine-learning weather models learn from historical weather records, such as the ERA5 reanalysis, and do not model the atmosphere with physics equations [6]. They generally need far less computing power [6]. Google DeepMind's GraphCast, described in a 2022 paper, predicts hundreds of weather variables over 10 days at 0.25 degree resolution, worldwide, in under a minute [1]. It beat the most accurate operational deterministic system on 90% of 1,380 verification targets [1]."

    "Intensity is the weak spot. NOAA says its first AI model is worse at hurricane intensity and that it is still improving the hybrid system on this [3]. ECMWF's AIFS was also weaker than physics models on intensity changes [6]. These systems rely on physics-based work for their starting data [2], and many of the big accuracy claims come from the makers' own tests [4]. See {{ai-in-science|AI in science}} and {{datacenters-energy|energy use}}."
