<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nathan's AI Wiki</title>
<meta name="description" content="AI explained plainly, every claim sourced, plus what Brawn, Personal and TLC use.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a reference-library shell. Category shelf on the left, the article in a
   reading column, sources and page outline on the right. Collapses to one column. */
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --ink: #16201d;
  --ink-2: #4b5a55;
  --ink-3: #5a6863;
  --rule: #d9e0dd;
  --accent: #0d6b5a;
  --accent-soft: #e1efea;
  --mark: #fff1b8;
  --focus: #1c5fd6;
  --brawn: #b4470f;
  --tlc: #1f56c4;
  --personal: #7a6400;

  --read: "Literata", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --s-1: clamp(.78rem, .76rem + .1vw, .84rem);
  --s0: clamp(.92rem, .9rem + .12vw, 1rem);
  --s1: clamp(1.05rem, 1rem + .25vw, 1.2rem);
  --s2: clamp(1.3rem, 1.15rem + .6vw, 1.65rem);
  --s3: clamp(1.8rem, 1.45rem + 1.5vw, 2.8rem);
  --radius: 8px;
  --bar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #161e1c; --ink: #e5ece9; --ink-2: #a9b7b2; --ink-3: #8d9b96;
    --rule: #2a3532; --accent: #5cc8b0; --accent-soft: #19302b; --mark: #4a4114; --focus: #7ea7ff; --brawn: #f08a4b; --tlc: #7ea7ff; --personal: #d9bf4a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #161e1c; --ink: #e5ece9; --ink-2: #a9b7b2; --ink-3: #8d9b96;
  --rule: #2a3532; --accent: #5cc8b0; --accent-soft: #19302b; --mark: #4a4114; --focus: #7ea7ff; --brawn: #f08a4b; --tlc: #7ea7ff; --personal: #d9bf4a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 var(--s0)/1.55 var(--ui); }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8;
  background: var(--surface); border-bottom: 1px solid var(--rule);
}
.bar-in {
  height: var(--bar); display: flex; align-items: center; gap: 12px;
  max-width: 1680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font: 700 var(--s1)/1 var(--read); color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand span { color: var(--accent); }
.search-btn {
  margin-left: auto; display: flex; align-items: center; gap: 10px;
  min-width: 0; width: min(28rem, 100%); height: 40px; padding: 0 12px;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--bg);
  color: var(--ink-3); cursor: text; text-align: left;
  transition: border-color .15s ease-out;
}
.search-btn:hover { border-color: var(--ink-3); }
.search-btn .label { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
kbd { font: 500 .72rem/1 var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 3px 5px; color: var(--ink-3); background: var(--surface); }
.home-link { margin-left: auto; color: var(--ink-2); font-size: var(--s-1); font-weight: 500; text-decoration: none; white-space: nowrap; }
.home-link:hover { color: var(--accent); text-decoration: underline; }
.home-link + .search-btn { margin-left: 0; }
.menu-btn { display: none; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-weight: 500; }

.sample {
  background: var(--accent-soft); color: var(--ink);
  font-size: var(--s-1);
}
.sample p { margin: 0; max-width: 1680px; margin-inline: auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- shell ---------- */
.shell {
  max-width: 1680px; margin: 0 auto;
  display: grid; grid-template-columns: 16.5rem minmax(0, 1fr) 15.5rem; gap: clamp(20px, 2.5vw, 48px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
.nav {
  position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); align-self: start;
  max-height: calc(100vh - var(--bar) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding: 20px 4px 24px 0; scrollbar-width: thin;
}
.nav h2 { font: 600 .72rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 18px 10px 8px; }
.nav h2:first-child { margin-top: 0; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.nav a {
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
  padding: 7px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: var(--s-1); font-weight: 500;
  transition: background-color .15s ease-out, color .15s ease-out;
}
.nav a:hover { background: var(--surface); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.nav a .n { font: 400 .72rem/1 var(--mono); color: var(--ink-3); }

main { min-width: 0; padding-top: 28px; }
/* Article pages: keep the side panel next to the reading column on wide screens. */
.shell.reading { grid-template-columns: 16.5rem minmax(0, 46rem) 15.5rem; justify-content: center; }
.rail {
  position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); align-self: start;
  max-height: calc(100vh - var(--bar) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  padding: 28px 0 24px; font-size: var(--s-1); scrollbar-width: thin;
}
.rail h2 { font: 600 .72rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.rail section + section { margin-top: 28px; }
.rail ol, .rail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rail a { color: var(--ink-2); text-decoration: none; }
.rail a:hover { color: var(--accent); text-decoration: underline; }
.rail .facts div { display: flex; justify-content: space-between; gap: 8px; padding-block: 6px; border-bottom: 1px solid var(--rule); }
.rail .facts dt { color: var(--ink-3); }
.rail .facts dd { margin: 0; font-family: var(--mono); font-size: .78rem; text-align: right; }

/* ---------- shared bits ---------- */
.crumbs { font-size: var(--s-1); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.crumbs a { color: var(--ink-3); }
.kicker { font: 600 .74rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
h1.title { font: 700 var(--s3)/1.08 var(--read); letter-spacing: -.015em; margin: 0; max-width: 22ch; }
.lede { font: 400 var(--s1)/1.5 var(--read); color: var(--ink-2); margin: 14px 0 0; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; font-size: var(--s-1); color: var(--ink-3); }
.meta b { font-weight: 500; color: var(--ink-2); }
.pill { font: 500 .72rem/1 var(--mono); padding: 4px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--ink-2); }
.pill.stub { background: var(--mark); color: var(--ink); }

/* ---------- article ---------- */
.article { max-width: 44rem; }
.oneline {
  margin: 26px 0 0; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--surface);
  border-radius: 0 var(--radius) var(--radius) 0; font-size: var(--s0);
}
.oneline strong { display: block; font: 600 .72rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.prose { font: 400 var(--s1)/1.7 var(--read); }
.prose h2 { font: 700 var(--s2)/1.2 var(--read); margin: 38px 0 10px; scroll-margin-top: calc(var(--bar) + 20px); }
.prose p { margin: 0 0 14px; max-width: 66ch; }
.prose ol { padding-left: 1.4em; margin: 0 0 14px; }
.prose li { margin-bottom: 8px; }
.prose a.wl { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; }
.prose a.wl:hover { color: var(--accent); }
.cite {
  font: 500 .66em/1 var(--mono); vertical-align: super; margin-left: 1px;
  border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 2px 4px; cursor: pointer;
}
.cite:hover { background: var(--accent); color: var(--surface); }
.stub-note { margin-top: 24px; padding: 14px 16px; border: 1px dashed var(--rule); border-radius: var(--radius); color: var(--ink-2); font-size: var(--s0); max-width: 66ch; }

.sources { margin-top: 44px; max-width: 44rem; }
.sources h2 { font: 700 var(--s2)/1.2 var(--read); margin: 0 0 6px; }
.sources > p { margin: 0 0 14px; color: var(--ink-3); font-size: var(--s-1); }
.sources ol { list-style: none; margin: 0; padding: 0; counter-reset: s; }
.sources li {
  counter-increment: s; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 2px 8px;
  padding: 12px 10px; border-top: 1px solid var(--rule); border-radius: 6px; transition: background-color .6s ease-out;
}
.sources li::before { content: counter(s); font: 500 .8rem/1.6 var(--mono); color: var(--accent); grid-row: span 2; }
.sources li a { font-weight: 500; overflow-wrap: anywhere; }
.sources li span { grid-column: 2; font-size: var(--s-1); color: var(--ink-3); }
.sources li.flash { background: var(--mark); transition: none; }

.related { margin-top: 36px; max-width: 44rem; }
.related h2 { font: 600 .74rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips a { padding: 8px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink); text-decoration: none; font-size: var(--s-1); transition: border-color .15s ease-out; }
.chips a:hover { border-color: var(--accent); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; max-width: 44rem; }
.pager a { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager a.next { text-align: right; grid-column: 2; }
.pager small { color: var(--ink-3); font-size: var(--s-1); }
.pager strong { font: 600 var(--s0)/1.3 var(--read); }

/* ---------- Nathan's way boxes ---------- */
.way { margin: 18px 0 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--src); border-radius: 0 var(--radius) var(--radius) 0; max-width: 66ch; font-size: var(--s0); }
.way[data-src="Brawn"] { --src: var(--brawn); }
.way[data-src="TLC"] { --src: var(--tlc); }
.way[data-src="Personal"] { --src: var(--personal); }
.way-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.src-tag { font: 600 .7rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--src); border: 1.5px solid var(--src); border-radius: 4px; padding: 4px 6px; }
.src-tag[data-src="Brawn"] { --src: var(--brawn); }
.src-tag[data-src="TLC"] { --src: var(--tlc); }
.src-tag[data-src="Personal"] { --src: var(--personal); }
.way p { margin: 4px 0 0; }
.way b { font-weight: 600; }
.ways-title { font: 700 var(--s2)/1.2 var(--read); margin: 38px 0 4px; }
.ways-note { margin: 0; color: var(--ink-3); font-size: var(--s-1); max-width: 66ch; }

/* ---------- comparison table ---------- */
.compare-wrap { overflow-x: auto; margin: 18px 0 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.compare { border-collapse: collapse; width: 100%; min-width: 36rem; font-size: var(--s-1); }
.compare th, .compare td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.compare thead th { font: 600 .72rem/1.2 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--bg); }
.compare tbody th { font: 600 var(--s0)/1.3 var(--read); white-space: nowrap; }
.compare tr:last-child > * { border-bottom: 0; }
.compare .used { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

/* ---------- where I'm active ---------- */
.active-wrap { overflow-x: auto; margin-top: 26px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.active { border-collapse: collapse; width: 100%; min-width: 34rem; font-size: var(--s-1); }
.active th, .active td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.active thead th { background: var(--bg); }
.active tbody th { font: 600 var(--s0)/1.3 var(--read); }
.active tbody th a { color: var(--ink); }
.active td.none { color: var(--ink-3); }
.active tr:last-child > * { border-bottom: 0; }
.learn { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 16px; margin-top: 28px; }
.learn ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 12px; }
.learn li strong { font: 600 var(--s0)/1.3 var(--read); }
.learn li p { margin: 2px 0 0; color: var(--ink-2); font-size: var(--s-1); }
.learn .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

/* ---------- lists of entries ---------- */
.entry-list { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 12px; }
.entry-list a {
  display: flex; flex-direction: column; gap: 6px; height: 100%;
  padding: 16px 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
  text-decoration: none; color: var(--ink); transition: border-color .15s ease-out;
}
.entry-list a:hover { border-color: var(--accent); }
.entry-list strong { font: 600 var(--s1)/1.3 var(--read); }
.entry-list p { margin: 0; color: var(--ink-2); font-size: var(--s-1); }
.entry-list .foot { margin-top: auto; padding-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .74rem; color: var(--ink-3); }

/* ---------- home ---------- */
.home-head { padding-bottom: 8px; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 16px; margin-top: 28px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
.panel h2 { font: 700 var(--s1)/1.2 var(--read); margin: 0 0 4px; }
.panel > p { margin: 0 0 12px; color: var(--ink-3); font-size: var(--s-1); }
.path { list-style: none; margin: 0; padding: 0; counter-reset: p; display: flex; flex-direction: column; }
.path li { counter-increment: p; border-top: 1px solid var(--rule); }
.path a { display: grid; grid-template-columns: 2rem 1fr; padding: 10px 0; color: var(--ink); text-decoration: none; }
.path a::before { content: counter(p); font: 500 .85rem/1.5 var(--mono); color: var(--accent); }
.path a:hover span { text-decoration: underline; }
.today-item { border-top: 1px solid var(--rule); padding: 12px 0; }
.today-item h3 { font: 600 var(--s0)/1.35 var(--read); margin: 4px 0; }
.today-item p { margin: 0; font-size: var(--s-1); color: var(--ink-2); }
.today-item .ex { font: 500 .7rem/1 var(--mono); color: var(--ink-3); }

.shelf-title { font: 700 var(--s2)/1.2 var(--read); margin: 44px 0 0; }
.shelf { list-style: none; margin: 16px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: 10px; }
.shelf a {
  display: flex; flex-direction: column; gap: 4px; height: 100%;
  padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface);
  text-decoration: none; color: var(--ink); transition: border-color .15s ease-out;
}
.shelf a:hover { border-color: var(--accent); }
.shelf strong { font: 600 var(--s0)/1.3 var(--read); }
.shelf span { font-size: var(--s-1); color: var(--ink-3); }
.shelf .n { font-family: var(--mono); font-size: .72rem; }

/* ---------- glossary + timeline ---------- */
.letters { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 22px; }
.letters button { min-width: 34px; height: 34px; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; cursor: pointer; font: 500 .8rem/1 var(--mono); }
.letters button:hover { border-color: var(--accent); }
.gloss { margin: 24px 0 0; max-width: 52rem; }
.gloss div { display: grid; grid-template-columns: minmax(8rem, 13rem) minmax(0, 1fr); gap: 4px 20px; padding: 12px 0; border-top: 1px solid var(--rule); scroll-margin-top: calc(var(--bar) + 16px); }
.gloss dt { font: 600 var(--s0)/1.4 var(--read); }
.gloss dd { margin: 0; color: var(--ink-2); }
.gloss dd a { white-space: nowrap; }

.timeline { list-style: none; margin: 28px 0 0; padding: 0; max-width: 50rem; border-left: 2px solid var(--rule); }
.timeline li { position: relative; padding: 0 0 22px 22px; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.timeline .yr { font: 500 .85rem/1.4 var(--mono); color: var(--accent); }
.timeline h2 { font: 600 var(--s1)/1.3 var(--read); margin: 2px 0 4px; }
.timeline p { margin: 0; color: var(--ink-2); }
.timeline .src { font-size: var(--s-1); margin-top: 4px; }

/* ---------- search dialog ---------- */
.palette[hidden] { display: none; }
.palette { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 35%, transparent); display: flex; justify-content: center; align-items: flex-start; padding: calc(8vh + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.palette-box { width: min(40rem, 100%); background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden; display: flex; flex-direction: column; max-height: 76vh; animation: pop .16s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.99); } }
.palette input { border: 0; border-bottom: 1px solid var(--rule); padding: 16px 18px; font: 400 var(--s1)/1.3 var(--ui); background: transparent; color: var(--ink); outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.palette li a { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.palette li a small { color: var(--ink-3); font-size: var(--s-1); }
.palette li a mark { background: var(--mark); color: inherit; border-radius: 2px; }
.palette li[aria-selected="true"] a { background: var(--accent-soft); }
.palette .hint { padding: 10px 16px; border-top: 1px solid var(--rule); font-size: .74rem; color: var(--ink-3); display: flex; gap: 14px; flex-wrap: wrap; }
.palette .none { padding: 18px; color: var(--ink-3); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .shell, .shell.reading { grid-template-columns: 15rem minmax(0, 1fr); }
  .rail { position: static; max-height: none; grid-column: 2; padding-top: 0; }
  .rail .toc { display: none; }
}
@media (max-width: 860px) {
  .shell, .shell.reading { grid-template-columns: minmax(0, 1fr); }
  .rail { grid-column: 1; }
  .menu-btn { display: inline-flex; align-items: center; }
  .search-btn kbd { display: none; }
  .nav {
    position: fixed; z-index: 15; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; max-height: none;
    width: min(20rem, 86vw); background: var(--surface); border-right: 1px solid var(--rule);
    padding: 16px 12px calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));

      ["What a backend does", "Every app that remembers anything needs one. It holds the database, signs people in, stores files like photos, and enforces the rules about who can read or change each record. Supabase, for example, bundles all of those on top of a standard Postgres database [1]."],
      ["The two big families", "Most options fall into two camps. Postgres-based services (Supabase, Neon) store data in tables, the long-standing industry standard, which makes it easier to move to another host later [1][5]. Document databases like Google's Firestore store data as nested records, which suits fast-changing mobile apps but is harder to move off [4]."],
      ["All-in-one or pieces", "Supabase and Firebase give you a database, sign-in and file storage in one place [1][3]. Neon is only the database, so you add sign-in from somewhere else; in return it can copy a whole database in seconds for safe testing [6]. Convex goes further the other way: your server code and the database live together, and screens update live on their own [7]. PocketBase is one small program you run on your own server [8]. Builders like Base44 hide the backend entirely, which is fastest to start and hardest to leave [9]."],
      ["How they compete", "They compete on three things: how fast you can start, what it costs as you grow, and how hard it is to leave. Who can see what is the part that bites. Supabase relies on row-level security rules you write yourself, and a missing rule can leave a table open to the internet [2]."],

      ["Guess, check, adjust", "A new model starts out guessing at random. In training it sees an example, makes a guess, and measures how far off it was. A method called backpropagation then nudges the model's internal numbers, called parameters, so the next guess is a little better [1]."],

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const byId = Object.fromEntries(E.map((e) => [e.id, e]));
const catById = Object.fromEntries(CATS.map((c) => [c.id, c]));
const inCat = (id) => E.filter((e) => e.cat === id);
const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function href(id) {
  if (id === "t-timeline") return "#timeline";
  return "#e-" + id;
}

function rich(text) {
  return esc(text)
    .replace(/\{\{([a-z0-9-]+)\|([^}]+)\}\}/g, (_, id, words) => `<a class="wl" href="${href(id)}">${words}</a>`)
    .replace(/\[(\d+)\]/g, (_, n) => `<button type="button" class="cite" data-n="${n}" aria-label="Source ${n}">${n}</button>`);
}

function sourceItem(key, n) {
  const s = S[key];
  return `<li id="src-${n}"><a href="${s.url}" target="_blank" rel="noopener">${esc(s.t)}</a><span>${esc(s.pub)} · ${s.type}</span></li>`;
}

    <ul>${CATS.filter((c) => c.group === g).map((c) => {
      const n = c.page ? (c.id === "glossary" ? GLOSSARY.length : c.id === "timeline" ? TIMELINE.length : c.id === "active" ? ACTIVE.length : "") : inCat(c.id).length;

}

function viewEntry(id) {
  const e = byId[id];

  const sibs = inCat(e.cat), i = sibs.indexOf(e);
  const prev = sibs[i - 1], next = sibs[i + 1];
  const sections = e.body.map(([h, p]) => `<h2 id="s-${slug(h)}">${esc(h)}</h2><p>${rich(p)}</p>`).join("");
  const path = e.path ? `<ol>${e.path.map((pid) => `<li><a class="wl" href="${href(pid)}">${esc(byId[pid].title)}</a>: ${esc(byId[pid].one)}</li>`).join("")}</ol>` : "";
  return {
    nav: e.cat, title: e.title, reading: true,
    main: `
      <article class="article">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span>/</span><a href="#c-${c.id}">${c.name}</a></nav>
        <h1 class="title">${esc(e.title)}</h1>
        <div class="meta"><span>Updated <b>${fmtDate(UPDATED)}</b></span><span><b>${e.src.length}</b> source${e.src.length === 1 ? "" : "s"}</span>${e.stub ? '<span class="pill stub">Starter entry</span>' : ""}</div>
        <div class="oneline"><strong>In one line</strong>${esc(e.one)}</div>
        <div class="prose">${sections}${path}${e.compare ? compareHTML(e.compare) : ""}</div>
        ${waysHTML(e.id)}
        ${e.stub ? `<p class="stub-note">This is a starter entry. When daily updates are on, it will grow with new sources as they appear.</p>` : ""}
      </article>
      ${e.src.length ? `<section class="sources" aria-labelledby="h-src"><h2 id="h-src">Sources</h2><p>Numbers in the text match this list. Each link opens the original in a new tab.</p><ol>${e.src.map((k, n) => sourceItem(k, n + 1)).join("")}</ol></section>` : ""}
      ${e.related.length ? `<section class="related"><h2>Related</h2><div class="chips">${e.related.map((r) => `<a href="${href(r)}">${esc(byId[r].title)}</a>`).join("")}</div></section>` : ""}
      <nav class="pager" aria-label="More in ${c.name}">
        ${prev ? `<a href="${href(prev.id)}"><small>Previous in ${c.name}</small><strong>${esc(prev.title)}</strong></a>` : ""}

      </nav>`,
    rail: `<section class="toc"><h2>On this page</h2><ol>${e.body.map(([h]) => `<li><a href="#e-${e.id}" data-jump="s-${slug(h)}">${esc(h)}</a></li>`).join("")}${e.compare ? `<li><a href="#e-${e.id}" data-jump="s-the-options">The options</a></li>` : ""}${CHOICES.some((c) => c.topic === e.id) ? `<li><a href="#e-${e.id}" data-jump="s-nathans-way">Nathan's way</a></li>` : ""}${e.src.length ? `<li><a href="#e-${e.id}" data-jump="h-src">Sources</a></li>` : ""}</ol></section>` +

  };
}

function route() {
  const h = (location.hash || "#home").slice(1);
  let v = null;
  if (h === "home" || h === "") v = viewHome();
  else if (h.startsWith("c-")) v = viewCat(h.slice(2));
  else if (h.startsWith("e-")) v = viewEntry(h.slice(2));
  else if (h === "glossary") v = viewGlossary();
  else if (h === "timeline") v = viewTimeline();
  else if (h === "today") v = viewToday();
  else if (h === "active") v = viewActive();
  if (!v) v = { nav: "", title: "Not found", main: `<h1 class="title">That page isn't here</h1><p class="lede">It may have moved. <a href="#home">Go to the front page</a> or press <kbd>/</kbd> to search.</p>`, rail: "" };
  return v;
}

function render() {
  const v = route();
  const apply = () => {
    $("#nav").innerHTML = navHTML(v.nav);
    $("#main").innerHTML = v.main;
    $("#rail").innerHTML = v.rail;
    $("#shell").classList.toggle("reading", !!v.reading);
    document.title = v.title === "Nathan's AI Wiki" ? v.title : v.title + " · Nathan's AI Wiki";
    window.scrollTo(0, 0);
    closeNav();
  };
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (document.startViewTransition && !calm && render.ran) document.startViewTransition(apply);
  else apply();
  render.ran = true;
}

// ---------- interactions ----------
document.addEventListener("click", (ev) => {
  const cite = ev.target.closest(".cite");
  if (cite) {
    const li = document.getElementById("src-" + cite.dataset.n);
    if (li) {
      li.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
      li.classList.add("flash");
      setTimeout(() => li.classList.remove("flash"), 900);
      li.querySelector("a").focus({ preventScroll: true });
    }
    return;
  }
  const jump = ev.target.closest("[data-jump]");
  if (jump) {
    ev.preventDefault();
    document.getElementById(jump.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const letter = ev.target.closest("[data-letter]");
  if (letter) {
    document.querySelector(`.gloss [data-l="${letter.dataset.letter}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

// mobile drawer
const menuBtn = $("#menu-btn"), scrim = $("#scrim");
function closeNav() { document.body.classList.remove("nav-open"); menuBtn.setAttribute("aria-expanded", "false"); scrim.hidden = true; }
menuBtn.addEventListener("click", () => {
  const open = !document.body.classList.contains("nav-open");
  document.body.classList.toggle("nav-open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  scrim.hidden = !open;
});
scrim.addEventListener("click", closeNav);

// search
const INDEX = [
  ...E.map((e) => ({ title: e.title, sub: catById[e.cat].name + " · " + e.one, hay: [e.title, e.one, catById[e.cat].name, ...e.body.flat()].join(" ").toLowerCase(), to: href(e.id) })),
  ...CATS.map((c) => ({ title: c.name, sub: "Topic · " + c.blurb, hay: (c.name + " " + c.blurb).toLowerCase(), to: c.page ? "#" + c.id : "#c-" + c.id })),
  ...GLOSSARY.map(([t, d]) => ({ title: t, sub: "Glossary · " + d, hay: (t + " " + d).toLowerCase(), to: "#glossary" })),
  ...ACTIVE.map(([area, id, by]) => ({ title: area, sub: "Where I'm active · " + Object.entries(by).filter(([, v]) => v).map(([k, v]) => k + ": " + v).join(" · "), hay: (area + " " + Object.values(by).join(" ")).toLowerCase(), to: "#active" })),
  ...TIMELINE.map(([y, h, p, , e]) => ({ title: `${y}: ${h}`, sub: "Timeline · " + p, hay: (y + " " + h + " " + p).toLowerCase(), to: "#timeline" })),
];
const pal = $("#palette"), q = $("#q"), results = $("#results");
let hits = [], sel = 0, lastFocus = null;

function search(text) {
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return INDEX.filter((x) => x.to.startsWith("#e-")).slice(0, 8);
  return INDEX
    .map((x) => {
      if (!words.every((w) => x.hay.includes(w))) return null;
      const t = x.title.toLowerCase();
      const score = words.reduce((s, w) => s + (t.startsWith(w) ? 6 : t.includes(w) ? 3 : 1), 0);
      return { ...x, score };
    })
    .filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 12);
}
function markUp(s, words) {
  let out = esc(s);
  words.forEach((w) => { if (w.length > 1) out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
  return out;
}
function drawResults() {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  hits = search(q.value);
  sel = Math.min(sel, Math.max(hits.length - 1, 0));
  results.innerHTML = hits.length
    ? hits.map((h, i) => `<li role="option" id="r-${i}" aria-selected="${i === sel}"><a href="${h.to}" tabindex="-1"><span>${markUp(h.title, words)}</span><small>${markUp(h.sub.length > 110 ? h.sub.slice(0, 110) + "…" : h.sub, words)}</small></a></li>`).join("")
    : `<li class="none">Nothing matches "${esc(q.value)}". Try fewer words, or browse the topics.</li>`;
  q.setAttribute("aria-activedescendant", hits.length ? "r-" + sel : "");
}
function openSearch() {
  lastFocus = document.activeElement;
  pal.hidden = false; q.value = ""; sel = 0; drawResults(); q.focus();
}
function closeSearch() { pal.hidden = true; lastFocus?.focus?.(); }
$("#search-btn").addEventListener("click", openSearch);
q.addEventListener("input", () => { sel = 0; drawResults(); });
q.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown") { ev.preventDefault(); sel = Math.min(sel + 1, hits.length - 1); drawResults(); document.getElementById("r-" + sel)?.scrollIntoView({ block: "nearest" }); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); sel = Math.max(sel - 1, 0); drawResults(); document.getElementById("r-" + sel)?.scrollIntoView({ block: "nearest" }); }
  else if (ev.key === "Enter" && hits[sel]) { ev.preventDefault(); pal.hidden = true; location.hash = hits[sel].to; }
  else if (ev.key === "Escape") closeSearch();
});
results.addEventListener("click", (ev) => { if (ev.target.closest("a")) pal.hidden = true; });
pal.addEventListener("click", (ev) => { if (ev.target === pal) closeSearch(); });
document.addEventListener("keydown", (ev) => {
  const typing = /input|textarea/i.test(document.activeElement?.tagName || "");
  if (!pal.hidden) { if (ev.key === "Escape") closeSearch(); return; }
  if ((ev.key === "/" && !typing) || ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k")) { ev.preventDefault(); openSearch(); }
  if (ev.key === "Escape") closeNav();
});

window.addEventListener("hashchange", render);
render();
</script>
</body>
